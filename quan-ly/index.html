<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#790013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lịch Monaca">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%3E%3Ctext%20y%3D'.9em'%20font-size%3D'90'%3E%F0%9F%97%93%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<title>Monaca · Quản lý lịch phòng</title>
<style>
  /* Trang nội bộ: ưu tiên dễ đọc (nền trắng, chữ đen, chữ to). Mỗi phòng một màu (--mp đậm, --mn nhạt), đặt theo phòng
     ở mauPhong(). Lượt Airbnb tô màu đậm, tự khoá tô màu nhạt của phòng; phần xám nhạt trên thanh là giờ còn trống. */
  :root {
    --nen: #F3F4F6; --the: #FFFFFF; --chu: #111111; --phu: #4B5563; --vach: #CBD5E1; --trongThanh: #E5E7EB;
    --homNay: #F59E0B; --dau: #1F2937; --mp: #6B7280; --mn: #F3F4F6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--nen); color: var(--chu); }
  body { font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding-bottom: 40px; }
  button { font: inherit; cursor: pointer; color: inherit; }
  header { position: sticky; top: 0; z-index: 20; background: var(--dau); color: #fff; padding: 10px 14px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; flex: 1 1 auto; font-weight: 700; }
  header .nutNho { background: #374151; color: #fff; border-color: #4B5563; }
  header .nutNho.banMoi { background: #F59E0B; color: #111; border-color: transparent; font-weight: 700; }
  header .nutNho.banMoi[hidden] { display: none; }
  .trangThai { font-size: 13px; white-space: nowrap; font-weight: 600; }
  .nutNho { border: 1px solid var(--vach); background: var(--the); color: var(--chu); border-radius: 8px; padding: 7px 12px;
    font-size: 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .nutNho:disabled { opacity: .55; cursor: default; }
  .khung { max-width: 1100px; margin: 0 auto; padding: 12px 14px; }
  .chonPhong { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .chonPhong button { border: 2px solid var(--mp); background: var(--the); color: var(--mp); border-radius: 8px; padding: 7px 14px;
    white-space: nowrap; font-weight: 700; }
  .chonPhong button.on { background: var(--mp); color: #fff; }
  .chonPhong button.tat { --mp: #111111; }
  .thanhThang { display: flex; align-items: center; gap: 8px; margin: 12px 0 6px; flex-wrap: wrap; }
  .thanhThang h2 { margin: 0; font-size: 20px; min-width: 160px; text-align: center; }
  .thanhThang .mui { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--vach); background: var(--the); font-size: 20px; line-height: 1; }
  .chuGiai { display: flex; gap: 14px; flex-wrap: wrap; color: var(--phu); font-size: 13px; margin: 4px 0 10px; }
  .chuGiai span { display: inline-flex; align-items: center; gap: 6px; }
  .chuGiai i { width: 22px; height: 10px; border-radius: 2px; display: inline-block; --mp: #374151; --mn: #D1D5DB; }
  .chuGiai i.trong { background: var(--trongThanh); border: 1px solid var(--vach); }
  .airbnb { background: var(--mp); }
  .tu { background: var(--mn); background: color-mix(in srgb, var(--mp) 40%, #fff); }

  /* Lịch tháng của một phòng */
  .luoi { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .luoi .thu { text-align: center; font-size: 13px; font-weight: 700; color: var(--phu); padding: 2px 0; }
  .o { position: relative; border: 1px solid var(--vach); background: var(--the); border-radius: 8px; min-height: 78px;
    padding: 5px 6px 6px; text-align: left; display: flex; flex-direction: column; gap: 4px; color: var(--chu); }
  .o:hover { border-color: var(--chu); }
  .o.kin { background: var(--mn); border-color: var(--mp); }
  .o.ngoai { visibility: hidden; }
  .o.qua { opacity: .45; }
  .o.homNay { box-shadow: inset 0 0 0 3px var(--homNay); }
  .o.chon { box-shadow: inset 0 0 0 3px var(--chu); }
  .o .so { font-weight: 700; font-size: 15px; }
  .o .tt { font-size: 12px; font-weight: 700; color: var(--chu); line-height: 1.2; word-break: break-word; }
  .o.kin .tt { color: var(--mp); }
  .thanh { display: block; position: relative; height: 10px; background: var(--trongThanh); border-radius: 3px; overflow: hidden; }
  .thanh i { position: absolute; top: 0; bottom: 0; }
  .thanh i.dang { opacity: .5; }

  /* Bảng tổng quan cả các phòng */
  .bang { overflow-x: auto; border: 1px solid var(--vach); border-radius: 10px; background: var(--the); }
  .bang table { border-collapse: separate; border-spacing: 0; min-width: 100%; }
  .bang th, .bang td { padding: 0; border-bottom: 1px solid var(--vach); }
  .bang th.ten { position: sticky; left: 0; z-index: 2; background: var(--the); text-align: left; padding: 6px 10px;
    font-size: 13px; font-weight: 700; color: var(--mp); min-width: 112px; max-width: 140px; border-right: 1px solid var(--vach);
    border-left: 6px solid var(--mp); }
  .bang thead th { font-size: 12px; color: var(--phu); font-weight: 600; padding: 4px 0; text-align: center; min-width: 40px; }
  .bang thead th.ten { border-left-color: transparent; color: var(--phu); }
  .bang thead th.cuoiTuan { color: var(--chu); background: #F9FAFB; }
  .bang thead th.homNay { color: #111; background: var(--homNay); border-radius: 6px 6px 0 0; }
  .bang td button { display: block; width: 40px; height: 50px; border: 0; border-left: 1px solid #EEF0F3; background: var(--the); padding: 5px 5px; }
  .bang td button.kin { background: var(--mn); }
  .bang td button.qua { opacity: .45; }
  .bang td button .thanh { height: 38px; border-radius: 3px; }
  .bang td button .thanh i { left: 0; right: 0; top: auto; bottom: auto; }

  /* Bảng chi tiết một ngày */
  .phu { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 30; display: flex; justify-content: flex-end; }
  .phu[hidden] { display: none; }
  .ngang { background: var(--the); width: min(460px, 100%); height: 100%; overflow-y: auto; padding: 16px; border-top: 6px solid var(--mp);
    box-shadow: -4px 0 18px rgba(0,0,0,.18); }
  @media (max-width: 640px) {
    .phu { align-items: flex-end; }
    .ngang { width: 100%; height: auto; max-height: 90vh; border-radius: 14px 14px 0 0; }
    .o { min-height: 66px; padding: 4px; border-radius: 6px; }
    .o .so { font-size: 14px; }
    .o .tt { font-size: 11px; }
    .luoi { gap: 3px; }
    header h1 { font-size: 15px; flex-basis: 100%; }
  }
  .ngang h3 { margin: 0 0 2px; font-size: 18px; color: var(--mp); }
  .ngang .phuDe { color: var(--chu); font-weight: 600; font-size: 14px; margin: 0 0 10px; }
  .dongX { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .dong24 { margin: 10px 0 10px; }
  .dong24 .thanh { height: 22px; border-radius: 5px; }
  .moc { display: flex; justify-content: space-between; font-size: 11px; color: var(--phu); margin-top: 2px; }
  .conTrong { font-weight: 800; font-size: 17px; margin: 4px 0 12px; color: #047857; }
  .conTrong.het { color: #B91C1C; }
  .conTrong small { display: block; font-weight: 600; font-size: 14px; color: var(--chu); }
  .luot { background: var(--the); border: 1px solid var(--vach); border-left: 8px solid var(--mp); border-radius: 8px; padding: 9px 11px; margin-bottom: 8px; }
  .luot.l-tu { border-left-color: var(--mn); border-left-color: color-mix(in srgb, var(--mp) 40%, #fff); }
  .luot.dang { opacity: .6; }
  .luot .nhanLoai { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; color: var(--phu); }
  .luot .gioLuot { font-weight: 700; font-size: 15px; margin: 2px 0; }
  .luot .ghi { color: var(--phu); font-size: 13px; }
  .luot .nut { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
  .nutLon { width: 100%; border: 0; border-radius: 10px; padding: 13px; background: var(--dau); color: #fff; font-weight: 700; margin-top: 6px; font-size: 15px; }
  .luot .tenKhach { font-size: 17px; font-weight: 800; margin: 2px 0; overflow-wrap: anywhere; }
  .luot .nut { flex-wrap: wrap; }
  .gioVaoRa { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 5px 0 3px; }
  .gioVaoRa small, .gioVaoRa b { display: block; }
  .gioVaoRa small { font-size: 11px; color: var(--phu); }
  .gioVaoRa b { font-size: 14px; }
  .chiTiet { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 6px 0 0; font-size: 13px; }
  .chiTiet dt { color: var(--phu); }
  .chiTiet dd { margin: 0; overflow-wrap: anywhere; white-space: pre-line; }
  .o .khachO { font-size: 12px; line-height: 1.2; color: var(--mp); font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 640px) {
    .o { min-width: 0; }
    .o .khachO { font-size: 10px; white-space: normal; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
  }
  .nutMoi { position: fixed; right: 18px; bottom: 18px; z-index: 25; border: 0; border-radius: 999px; padding: 14px 20px;
    background: var(--dau); color: #fff; font-size: 16px; font-weight: 800; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
  #manChinh { padding-bottom: 76px; }

  /* Form booking */
  .booking [hidden] { display: none; }
  .nhomTieuDe { font-weight: 800; font-size: 14px; margin: 14px 0 6px; }
  .chonPhongBk { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .chonPhongBk button { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; padding: 7px 9px; text-align: left;
    border: 2px solid var(--mp); border-radius: 8px; background: var(--the); color: var(--mp); }
  .chonPhongBk button b { font-size: 13px; }
  .chonPhongBk button small { font-size: 12px; }
  .chonPhongBk button.on { background: var(--mp); color: #fff; }
  .booking .goiY { margin: 0 0 8px; }
  .booking .goiY button.on { border-style: solid; background: var(--dau); border-color: var(--dau); color: #fff; }
  .khungGio { margin-bottom: 8px; }
  .khungGio > b { font-size: 13px; }
  .hangGio { display: grid; grid-template-columns: 3fr 2fr; gap: 8px; margin-top: 3px; }
  .hangGio > * { min-width: 0; height: 46px; }
  .soDem { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 10px; }
  .soDem .nutNho { min-width: 44px; height: 40px; justify-content: center; font-size: 20px; }
  .booking .loiForm { white-space: pre-line; }
  .trongOk { color: #047857; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  form .oChon { flex-direction: row; align-items: flex-start; gap: 8px; padding: 8px 10px; margin-bottom: 8px; border-radius: 8px;
    background: #FEF3C7; color: #78350F; }
  form .oChon input { width: 20px; height: 20px; flex: none; margin: 0; padding: 0; }
  .booking .docRa { min-height: 16px; font-size: 12px; font-weight: 500; }
  .luuBooking { position: sticky; bottom: 0; }
  .nutLon.phu2 { background: var(--the); color: var(--dau); border: 2px solid var(--dau); }
  .nutLon.chinhNgay { margin: 0 0 12px; background: var(--mp); }

  /* Chỉnh giờ kín trong một ngày */
  .khungKin { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 8px; }
  .khungKin label { flex: 1 1 0; min-width: 0; }
  .khungKin .nutNho { height: 44px; justify-content: center; }
  .thanh i.kinXem { background: var(--mp); }

  /* Form khoá / sửa */
  form .hang { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--phu); }
  form input, form select { font: inherit; color: var(--chu); border: 1px solid #9CA3AF; border-radius: 8px; padding: 10px; background: var(--the); width: 100%; }
  form input[readonly], form select:disabled { background: #F3F4F6; color: var(--phu); }
  form .rong { grid-column: 1 / -1; }
  .goiY { display: flex; gap: 6px; flex-wrap: wrap; margin: -4px 0 10px; }
  .goiY button { border: 1px dashed #9CA3AF; background: var(--the); border-radius: 999px; padding: 5px 10px; font-size: 13px; }
  .canhBao { background: #FEF3C7; color: #78350F; border-radius: 8px; padding: 8px 10px; font-size: 14px; margin-bottom: 10px; white-space: pre-line; }
  .ghiChuGop { background: #DBEAFE; color: #1E3A8A; border-radius: 8px; padding: 8px 10px; font-size: 14px; margin-bottom: 10px; }
  .loiForm { background: #FEE2E2; color: #991B1B; border-radius: 8px; padding: 8px 10px; font-size: 14px; margin-bottom: 10px; }
  .nhoNhe { font-size: 13px; color: var(--phu); margin: 0 0 10px; }

  /* Flash sale */
  header .nutNho.fsNut { background: linear-gradient(135deg, #E11D48, #F97316); border-color: transparent; font-weight: 700; }
  .fsO { position: absolute; top: 4px; right: 5px; font-size: 13px; line-height: 1; }
  .bang td button { position: relative; }
  .bang td button .fsO { top: 1px; right: 1px; font-size: 10px; }
  .luot.fsThe { border-left-color: #E11D48; }
  .fsGia { font-size: 14px; margin: 4px 0; }
  .fsGia b, .goiYGia b { color: #E11D48; }
  .fsNgay { background: #FFE4E6; color: #9F1239; border-radius: 8px; padding: 8px 10px; font-size: 14px; margin-bottom: 10px; }
  .chonPhongFs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  form .chonPhongFs label { flex-direction: row; align-items: center; gap: 6px; border: 2px solid var(--mp); color: var(--mp); border-radius: 8px;
    padding: 6px 10px; font-weight: 700; font-size: 14px; }
  form .chonPhongFs input { width: auto; padding: 0; }
  .goiYGia { font-size: 12px; font-weight: 500; color: var(--phu); min-height: 16px; }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #111827; color: #fff; padding: 11px 16px;
    border-radius: 8px; z-index: 50; max-width: 92vw; font-size: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .dangTai { text-align: center; color: var(--phu); padding: 40px 0; }
  .loiTai { background: #FEE2E2; color: #991B1B; border-radius: 10px; padding: 14px; margin-top: 12px; }
  body.chuaKhoa .canKhoa { display: none; }
  .the { background: var(--the); border: 1px solid var(--vach); border-radius: 12px; padding: 18px; margin-top: 18px; }
  .the h2 { margin: 0 0 8px; font-size: 18px; }
  .the p { color: var(--phu); margin: 0 0 12px; }
  .the input { font: inherit; width: 100%; border: 1px solid #9CA3AF; border-radius: 8px; padding: 10px; margin-bottom: 4px; }
</style>

</head>
<body>
<header>
  <h1>🗓 Monaca · Quản lý lịch phòng</h1>
  <span class="trangThai canKhoa" id="trangThai" aria-live="polite"></span>
  <button class="nutNho canKhoa banMoi" id="nutBanMoi" type="button" hidden>⟳ Có bản mới · bấm tải lại</button>
  <button class="nutNho canKhoa fsNut" id="nutFlash" type="button">⚡ Flash sale</button>
  <button class="nutNho canKhoa" id="nutDongBo" type="button" title="Đọc lịch Airbnb ngay">↻ Đồng bộ Airbnb</button>
  <button class="nutNho canKhoa" id="nutTaiLai" type="button">Tải lại</button>
  <a class="nutNho canKhoa" id="linkSheet" target="_blank" rel="noopener">Mở Sheet ↗</a>
  <button class="nutNho canKhoa" id="nutThoat" type="button" title="Xoá khoá quản lý khỏi máy này">Thoát</button>
</header>
<div class="khung" id="manKhoa" hidden>
  <div class="the">
    <h2>Mở trang quản lý lịch</h2>
    <p>Dán link quản lý vào ô dưới (lấy trong Sheet: menu 🏡 Homestay → 🗓 Trang quản lý lịch). Trang sẽ nhớ trên máy này.</p>
    <div class="loiTai" id="loiKhoa" hidden></div>
    <input id="oKhoa" type="text" autocomplete="off" placeholder="https://monacasaigon.github.io/tra-cuu/quan-ly/#khoa=…">
    <button class="nutLon" id="nutKhoa" type="button">Mở lịch</button>
  </div>
</div>
<div class="khung canKhoa" id="manChinh">
  <div class="chonPhong" id="chonPhong"></div>
  <div class="thanhThang">
    <button class="mui" id="thangTruoc" type="button" aria-label="Tháng trước">‹</button>
    <h2 id="tenThang"></h2>
    <button class="mui" id="thangSau" type="button" aria-label="Tháng sau">›</button>
    <button class="nutNho" id="veHomNay" type="button">Hôm nay</button>
  </div>
  <div class="chuGiai">
    <span><i class="airbnb"></i>Màu đậm: khách đặt Airbnb</span>
    <span><i class="tu"></i>Màu nhạt: khách khác / tự khoá</span>
    <span><i class="trong"></i>Xám nhạt: còn trống (thanh 0h → 24h)</span>
  </div>
  <div id="lich"><p class="dangTai">Đang tải lịch…</p></div>
  <button class="nutMoi" id="nutBooking" type="button">+ Booking mới</button>
</div>

<div class="phu" id="phu" hidden>
  <div class="ngang" id="ngang" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* API: web app Apps Script (Execute as me, Anyone), hàm doPost. Mọi thao tác kèm khoá bí mật của chủ nhà. */
var API = 'https://script.google.com/macros/s/AKfycbxlyugzghvFzZNkScF2WmAJDVKNSbyo2CA06NLzREdQJ3chM_xY87QUMlzLMkPrdPNU/exec';
/* Phiên bản trang: đổi mỗi lần sửa trang. Tab mở lâu (vd trên điện thoại) tự dò bản trên GitHub, khác thì hiện nút tải lại. */
var BAN_TRANG = '2026-11-22a';
/* Khoá nằm sau dấu # của link (không gửi lên máy chủ GitHub), lưu lại trên máy rồi xoá khỏi thanh địa chỉ. */
var KHO_KHOA = 'monacaQuanLyKhoa', KHO_DL = 'monacaQuanLyDL';
function layKhoa(s) { var m = String(s || '').match(/(?:khoa=)?([0-9a-f]{32,})/i); return m ? m[1].toLowerCase() : ''; }
var KHOA = (function () {
  var k = layKhoa(location.hash);
  if (k) {
    try { localStorage.setItem(KHO_KHOA, k); } catch (e) {}
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    return k;
  }
  try { return localStorage.getItem(KHO_KHOA) || ''; } catch (e) { return ''; }
})();
function quenKhoa() {
  KHOA = '';
  try { localStorage.removeItem(KHO_KHOA); localStorage.removeItem(KHO_DL); } catch (e) {}
}

var DL = null, KHOI = {}, CHON = 'tat', THANG = 0, NGAY_MO = null;
var THU = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];

function byId(id) { return document.getElementById(id); }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function nut(chu, cls, bam) { var b = el('button', cls || 'nutNho', chu); b.type = 'button'; if (bam) b.addEventListener('click', bam); return b; }
/* Mốc thời gian tính bằng phút theo giờ Việt Nam (Date.UTC để không lệch theo múi giờ của máy). */
function phut(s) { var p = s.split('T'), d = p[0].split('-'), t = (p[1] || '00:00').split(':'); return Date.UTC(+d[0], +d[1] - 1, +d[2], +t[0], +t[1]) / 60000; }
function iso(m) { return new Date(m * 60000).toISOString().slice(0, 10); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function gioPhut(m) { var x = ((m % 1440) + 1440) % 1440; return pad(Math.floor(x / 60)) + ':' + pad(x % 60); }
function thu(m) { return new Date(m * 60000).getUTCDay(); }
function dauNgay(m) { return Math.floor(m / 1440) * 1440; }
function ngayNgan(m) { var d = new Date(m * 60000); return THU[d.getUTCDay()] + ' ' + d.getUTCDate() + '/' + (d.getUTCMonth() + 1); }
function ngayDu(m) { var d = new Date(m * 60000); return THU[d.getUTCDay()] + ' ' + pad(d.getUTCDate()) + '/' + pad(d.getUTCMonth() + 1) + '/' + d.getUTCFullYear(); }
function moc(m) { return gioPhut(m) + ' ' + ngayNgan(dauNgay(m)); }
function dauThang(m) { var d = new Date(m * 60000); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1) / 60000; }
function themThang(m, n) { var d = new Date(m * 60000); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + n, 1) / 60000; }
function tenGon(p) { return String(p).replace(/^Phòng\s*/, ''); }
function homNay() { return dauNgay(phut(DL.bayGio)); }
/* 750 phút → "12h30", 720 → "12h"; 24:00 ghi là 24h. */
function gioGon(m) { var h = Math.floor(m / 60), p = m % 60; return h + 'h' + (p ? pad(p) : ''); }
function khoang(a, b) { return gioGon(a) + '–' + gioGon(b); }

/* Chỉ hai loại: lượt khách đặt trên Airbnb — ghi chú có chữ "Airbnb" (chủ nhà tự ghi "Airbnb" hoặc đồng bộ về
   "Airbnb (tự đồng bộ)") — và tự khoá: mọi lượt còn lại, kể cả ngày tự chặn trên Airbnb ("Airbnb chặn (tự đồng bộ)"). */
var GHI_AIRBNB = 'Airbnb (tự đồng bộ)', GHI_CHAN = 'Airbnb chặn (tự đồng bộ)';
function loai(r) {
  var g = String(r.ghiChu);
  if (g.indexOf(GHI_CHAN) >= 0) return 'tu';
  if (g.indexOf(GHI_AIRBNB) >= 0) return 'airbnb';
  var t = docGhi(g);
  if (t.nguon) return t.nguon === 'Airbnb' ? 'airbnb' : 'tu';
  if (t.khach) return 'tu';
  return /airbnb/i.test(g) && g.indexOf('chặn') < 0 ? 'airbnb' : 'tu';
}
/* Dòng do đồng bộ Airbnb tạo ra (lượt đặt hoặc ngày chặn): khi chỉnh giờ từng ngày vẫn giữ ghi chú đồng bộ để lần sau nhận ra. */
function laDongBo(r) { return /\(tự đồng bộ\)/.test(String(r.ghiChu)); }
var TEN_LOAI = { airbnb: 'Airbnb · khách đặt', tu: 'Tự khoá' };

/* Mỗi phòng một màu [đậm, nhạt]: 101 đỏ tươi, 201 xanh dương cyan, 202 xanh lá, 301 nâu. */
var MAU_PHONG = { '101': ['#E11D2E', '#FDE3E5'], '201': ['#0891B2', '#DDF4FA'], '202': ['#16A34A', '#E3F6EA'], '301': ['#8B5A2B', '#F2E7DC'] };
function datMau(nutHtml, p) {
  var m = MAU_PHONG[(String(p).match(/\d+/) || [])[0]] || ['#6B7280', '#F3F4F6'];
  nutHtml.style.setProperty('--mp', m[0]);
  nutHtml.style.setProperty('--mn', m[1]);
  return nutHtml;
}

/* Khối khoá của từng phòng: mọi lượt chồng giờ lên nhau, khác loại cũng vậy, gộp thành một khối để trang chỉ hiện một
   lệnh cho cùng một khoảng thời gian. Tự khoá nối liền tự khoá cũng gộp; hai lượt Airbnb nối tiếp (khách trước trả 13:00,
   khách sau nhận 13:00) thì giữ riêng. Khối có lượt Airbnb thì tính là Airbnb. k.ds giữ từng lượt để vẽ thanh đúng loại. */
function tinhKhoi() {
  KHOI = {};
  DL.phong.forEach(function (p) { KHOI[p] = []; });
  var ds = DL.dong.filter(function (r) { return r.bd && r.kt && KHOI[r.phong]; })
    .map(function (r) { return { r: r, bd: phut(r.bd), kt: phut(r.kt), loai: loai(r) }; })
    .filter(function (l) { return l.kt > l.bd; })
    .sort(function (a, b) { return a.bd - b.bd || a.kt - b.kt; });
  var cuoi = {};
  ds.forEach(function (l) {
    var k = cuoi[l.r.phong];
    if (k && (l.bd < k.kt || (l.bd === k.kt && l.loai === 'tu' && k.loai === 'tu'))) {
      k.kt = Math.max(k.kt, l.kt); k.dong.push(l.r); k.ds.push(l);
      if (l.loai === 'airbnb') k.loai = 'airbnb';
    } else {
      k = { phong: l.r.phong, loai: l.loai, bd: l.bd, kt: l.kt, dong: [l.r], ds: [l] };
      KHOI[l.r.phong].push(k);
      cuoi[l.r.phong] = k;
    }
  });
}
/* Phần các khối nằm trong ngày [ngay, ngay + 1440), tính bằng phút trong ngày. */
function trongNgay(p, ngay) {
  var kq = [];
  (KHOI[p] || []).forEach(function (k) {
    var a = Math.max(k.bd, ngay), b = Math.min(k.kt, ngay + 1440);
    if (b > a) kq.push({ k: k, a: a - ngay, b: b - ngay, ngay: ngay });
  });
  return kq;
}
/* Các khoảng còn trống trong ngày (không phân biệt loại khoá). */
function khoangTrong(doan) {
  var gop = [];
  doan.slice().sort(function (x, y) { return x.a - y.a; }).forEach(function (d) {
    var c = gop[gop.length - 1];
    if (c && d.a <= c[1]) c[1] = Math.max(c[1], d.b); else gop.push([d.a, d.b]);
  });
  var trong = [], tu = 0;
  gop.forEach(function (x) { if (x[0] > tu) trong.push([tu, x[0]]); tu = Math.max(tu, x[1]); });
  if (tu < 1440) trong.push([tu, 1440]);
  return trong;
}
function moTaNgay(doan) {
  var trong = khoangTrong(doan), tong = trong.reduce(function (s, x) { return s + x[1] - x[0]; }, 0);
  if (!doan.length) return { cls: '', chu: '', tong: 1440, trong: trong };
  if (tong <= 0) return { cls: 'kin', chu: 'Kín', tong: 0, trong: [] };
  return { cls: 'mot', chu: 'Trống ' + trong.map(moTaKhoang).join(', '), tong: tong, trong: trong };
}
/* Một khoảng trống trong ngày: "trước 13h", "từ 17h", "từ 11h đến 19h". */
function moTaKhoang(x) {
  if (x[0] <= 0) return 'trước ' + gioGon(x[1]);
  if (x[1] >= 1440) return 'từ ' + gioGon(x[0]);
  return 'từ ' + gioGon(x[0]) + ' đến ' + gioGon(x[1]);
}
function dangLuu(k) { return k.dong.some(function (r) { return r.dang; }); }
/* Vẽ từng lượt trong khối theo đúng loại: Airbnb màu đậm, tự khoá màu nhạt chỉ ở phần Airbnb chưa phủ. */
function veThanh(thanh, doan, laQua, doc) {
  doan.forEach(function (d) {
    var cat = function (l) { return [Math.max(l.bd, d.ngay) - d.ngay, Math.min(l.kt, d.ngay + 1440) - d.ngay]; };
    var phu = d.k.ds.filter(function (l) { return l.loai === 'airbnb'; }).map(cat);
    d.k.ds.forEach(function (l) {
      var manh = [cat(l)];
      if (l.loai === 'tu') phu.forEach(function (c) {
        manh = [].concat.apply([], manh.map(function (m) { return [[m[0], Math.min(m[1], c[0])], [Math.max(m[0], c[1]), m[1]]]; }));
      });
      manh.forEach(function (m) {
        var a = m[0], b = m[1];
        if (b <= a) return;
        var i = el('i', l.loai + (laQua ? ' qua' : '') + (l.r.dang ? ' dang' : ''));
        if (doc) { i.style.top = (a / 14.4) + '%'; i.style.height = ((b - a) / 14.4) + '%'; }
        else { i.style.left = (a / 14.4) + '%'; i.style.width = ((b - a) / 14.4) + '%'; }
        thanh.appendChild(i);
      });
    });
  });
}

/* ------------------------------ Vẽ ------------------------------ */
function veChonPhong() {
  var box = byId('chonPhong');
  box.textContent = '';
  [['tat', 'Tất cả phòng']].concat(DL.phong.map(function (p) { return [p, tenGon(p)]; })).forEach(function (x) {
    var b = nut(x[1], (x[0] === 'tat' ? 'tat ' : '') + (CHON === x[0] ? 'on' : ''), function () { CHON = x[0]; veChonPhong(); ve(); });
    if (x[0] !== 'tat') datMau(b, x[0]);
    box.appendChild(b);
  });
}

function ve() {
  var d = new Date(THANG * 60000);
  byId('tenThang').textContent = 'Tháng ' + (d.getUTCMonth() + 1) + '/' + d.getUTCFullYear();
  var lich = byId('lich');
  lich.textContent = '';
  if (CHON === 'tat') veTongQuan(lich); else veThangPhong(lich, CHON);
  var n = dsFlash().length;
  byId('nutFlash').textContent = '⚡ Flash sale' + (n ? ' (' + n + ')' : '');
}

function veThangPhong(lich, p) {
  var hn = homNay(), dau = THANG, sau = themThang(THANG, 1);
  var batDau = dau - ((thu(dau) + 6) % 7) * 1440;   // lùi về thứ 2
  var luoi = datMau(el('div', 'luoi'), p);
  ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'].forEach(function (t) { luoi.appendChild(el('div', 'thu', t)); });
  for (var m = batDau; m < sau || (m - batDau) / 1440 % 7; m += 1440) {
    var doan = trongNgay(p, m), mt = moTaNgay(doan);
    var o = el('button', 'o ' + mt.cls + (m < dau || m >= sau ? ' ngoai' : '') + (m < hn ? ' qua' : '') + (m === hn ? ' homNay' : '') +
      (NGAY_MO && NGAY_MO.p === p && NGAY_MO.ngay === m ? ' chon' : ''));
    o.type = 'button';
    o.appendChild(el('span', 'so', String(new Date(m * 60000).getUTCDate())));
    if (flashNgay(p, m).length) o.appendChild(el('span', 'fsO', '⚡'));
    var thanh = el('span', 'thanh');
    veThanh(thanh, doan, m < hn, false);
    o.appendChild(thanh);
    khachDem(p, m).forEach(function (t) { o.appendChild(el('span', 'khachO', t)); });
    if (mt.chu) o.appendChild(el('span', 'tt', mt.chu));
    o.setAttribute('aria-label', ngayDu(m) + ': ' + (mt.chu || 'trống cả ngày'));
    (function (ngay) { o.addEventListener('click', function () { moNgay(p, ngay); }); })(m);
    luoi.appendChild(o);
  }
  lich.appendChild(luoi);
}

/* Tên khách hiện trên ô ngày: khách nhận hôm đó hoặc ở qua đêm đó (sáng trả phòng thì không lặp tên). */
function khachDem(p, m) {
  var ds = [];
  DL.dong.forEach(function (r) {
    if (r.phong !== p || !r.bd || !r.kt) return;
    var vao = dauNgay(phut(r.bd)), ra = dauNgay(phut(r.kt));
    if (!(vao === m || (vao < m && ra > m))) return;
    var t = tenKhach(r);
    if (t && ds.indexOf(t) < 0) ds.push(t);
  });
  return ds;
}

function veTongQuan(lich) {
  var hn = homNay(), dau = THANG, sau = themThang(THANG, 1);
  var bang = el('div', 'bang'), t = el('table'), dauBang = el('thead'), tr = el('tr');
  tr.appendChild(el('th', 'ten', 'Phòng'));
  for (var m = dau; m < sau; m += 1440) {
    var th = el('th', (thu(m) === 0 || thu(m) === 6 ? 'cuoiTuan' : '') + (m === hn ? ' homNay' : ''));
    th.appendChild(el('div', null, THU[thu(m)]));
    th.appendChild(el('div', null, String(new Date(m * 60000).getUTCDate())));
    tr.appendChild(th);
  }
  dauBang.appendChild(tr);
  t.appendChild(dauBang);
  var than = el('tbody');
  DL.phong.forEach(function (p) {
    var hang = datMau(el('tr'), p);
    hang.appendChild(el('th', 'ten', tenGon(p)));
    for (var m = dau; m < sau; m += 1440) {
      var doan = trongNgay(p, m), mt = moTaNgay(doan), td = el('td'), b = el('button', mt.cls + (m < hn ? ' qua' : ''));
      b.type = 'button';
      b.title = tenGon(p) + ' · ' + ngayDu(m) + ' · ' + khachDem(p, m).concat(mt.chu || 'trống cả ngày').join(' · ');
      var thanh = el('span', 'thanh');
      veThanh(thanh, doan, m < hn, true);
      b.appendChild(thanh);
      if (flashNgay(p, m).length) b.appendChild(el('span', 'fsO', '⚡'));
      (function (phong, ngay) { b.addEventListener('click', function () { moNgay(phong, ngay); }); })(p, m);
      td.appendChild(b);
      hang.appendChild(td);
    }
    than.appendChild(hang);
  });
  t.appendChild(than);
  bang.appendChild(t);
  lich.appendChild(bang);
  lich.appendChild(el('p', 'nhoNhe', 'Mỗi ô là một ngày, thanh dọc từ 0h (trên) đến 24h (dưới), phần xám nhạt là còn trống. Bấm vào ô để xem và khoá/mở khoá.'));
  var o = bang.querySelector('th.homNay');
  if (o) bang.scrollLeft = Math.max(0, o.offsetLeft - 150);
}

/* ------------------------------ Bảng một ngày ------------------------------ */
function moNgay(p, ngay) {
  NGAY_MO = { p: p, ngay: ngay };
  var hn = homNay(), doan = trongNgay(p, ngay), mt = moTaNgay(doan), box = datMau(byId('ngang'), p);
  box.textContent = '';
  var dau = el('div', 'dongX');
  dau.appendChild(el('h3', null, p));
  var dong = nut('✕', 'nutNho', dongPhu);
  dong.setAttribute('aria-label', 'Đóng');
  dau.appendChild(dong);
  box.appendChild(dau);
  box.appendChild(el('p', 'phuDe', ngayDu(ngay) + (ngay < hn ? ' · đã qua' : ngay === hn ? ' · hôm nay' : '')));

  var d24 = el('div', 'dong24'), thanh = el('div', 'thanh');
  veThanh(thanh, doan, false, false);
  d24.appendChild(thanh);
  var mocGio = el('div', 'moc');
  ['0h', '6h', '12h', '18h', '24h'].forEach(function (s) { mocGio.appendChild(el('span', null, s)); });
  d24.appendChild(mocGio);
  box.appendChild(d24);

  /* Chỉ cần biết ngày còn trống bao nhiêu, không cần tách từng lệnh khoá. */
  var ct = el('div', 'conTrong' + (mt.tong ? '' : ' het'));
  if (mt.tong >= 1440) ct.textContent = '✓ Trống cả ngày';
  else if (!mt.tong) ct.textContent = 'Kín cả ngày';
  else {
    ct.textContent = 'Còn trống ' + gioGon(mt.tong);
    ct.appendChild(el('small', null, mt.trong.map(function (x) { return khoang(x[0], x[1]); }).join(' · ')));
  }
  box.appendChild(ct);
  flashNgay(p, ngay).forEach(function (f) {
    var fs = el('div', 'fsNgay', '⚡ ' + (f.ten || 'Flash sale') + ': ' + giaFlashGon(f) + ' · kết thúc ' + moc(phut(f.het)));
    fs.style.cursor = 'pointer';
    fs.addEventListener('click', moFlash);
    box.appendChild(fs);
  });
  /* Chỉnh đúng giờ kín của riêng ngày này, không phụ thuộc lệnh nào (lệnh kéo dài nhiều ngày cũng chỉ đổi phần trong ngày). */
  if (ngay >= hn) box.appendChild(nut('✎ Chỉnh giờ kín trong ngày này', 'nutLon chinhNgay', function () { moChinhNgay(p, ngay); }));

  /* Mỗi booking một thẻ (không gộp theo khối). Giờ chỉ sửa theo ngày; thẻ cho sửa thông tin khách và huỷ cả booking. */
  DL.dong.filter(function (r) { return r.phong === p && r.bd && r.kt && phut(r.bd) < ngay + 1440 && phut(r.kt) > ngay; })
    .sort(function (a, b) { return phut(a.bd) - phut(b.bd); })
    .forEach(function (r) { box.appendChild(theLuot(r)); });

  box.appendChild(nut('+ Booking mới từ ngày này', 'nutLon', function () {
    moBooking({ phong: p, bd: ngay + DL.gioNhan * 60, kt: ngay + 1440 + DL.gioTra * 60 });
  }));
  byId('phu').hidden = false;
  if (CHON !== 'tat') ve();
}

function dongPhu() { byId('phu').hidden = true; NGAY_MO = null; if (DL && CHON !== 'tat') ve(); }

/* ------------------------------ Chỉnh giờ kín trong một ngày ------------------------------
   Chủ nhà ghi đúng các khung giờ phòng kín trong một ngày. Trang tự cắt mọi dòng phủ qua ngày đó: phần trước và sau ngày giữ
   nguyên (dòng đồng bộ Airbnb giữ nhãn đồng bộ, lần đồng bộ sau vẫn nhận ra), giờ vẫn kín giữ ở dòng cũ, giờ mới kín thì nối
   vào dòng liền kề (dòng đồng bộ chỉ nối khi không đổi ngày) hoặc thêm một lệnh tự khoá. Gửi một lần (hanh 'suaNgay'). */
function gopKhoang(ds) {
  var kq = [];
  ds.filter(function (x) { return x[1] > x[0]; }).sort(function (a, b) { return a[0] - b[0]; }).forEach(function (x) {
    var c = kq[kq.length - 1];
    if (c && x[0] <= c[1]) c[1] = Math.max(c[1], x[1]); else kq.push([x[0], x[1]]);
  });
  return kq;
}
function giaoKhoang(a, ds) {
  return ds.map(function (x) { return [Math.max(a[0], x[0]), Math.min(a[1], x[1])]; }).filter(function (x) { return x[1] > x[0]; });
}
function truKhoang(ds, bo) {
  var kq = [];
  ds.forEach(function (x) {
    var con = [[x[0], x[1]]];
    bo.forEach(function (b) {
      con = [].concat.apply([], con.map(function (c) { return [[c[0], Math.min(c[1], b[0])], [Math.max(c[0], b[1]), c[1]]]; }))
        .filter(function (c) { return c[1] > c[0]; });
    });
    kq = kq.concat(con);
  });
  return kq;
}

/* kin: các khoảng kín mong muốn trong ngày (phút từ 0h, đã gộp). Trả về { sua: [{ r, moi: {a, b} | null }], them: [{ a, b, ghiChu }] }. */
function keHoachNgay(p, ngay, kin, ghiMoi) {
  var d0 = ngay, d1 = ngay + 1440, K = kin.map(function (x) { return [d0 + x[0], d0 + x[1]]; });
  var ds = DL.dong.filter(function (r) {
    return r.phong === p && r.bd && r.kt && phut(r.kt) > phut(r.bd) && phut(r.bd) <= d1 && phut(r.kt) >= d0;
  });
  /* Phần trong ngày mỗi dòng giữ lại = phần vẫn kín. Dòng nào phải đổi thì bỏ luôn giờ đã có dòng khác giữ (vd ngày chặn
     trùng lượt khách đặt), ưu tiên giữ ở lượt Airbnb, rồi booking có tên khách, rồi dòng đồng bộ, rồi tự khoá; dòng không đổi thì để nguyên. */
  var tt = ds.map(function (r) {
    var A = phut(r.bd), B = phut(r.kt), trong = [Math.max(A, d0), Math.min(B, d1)];
    var co = trong[1] > trong[0], giu = co ? giaoKhoang(trong, K) : [];
    return { r: r, A: A, B: B, giu: giu, doi: co && !(giu.length === 1 && giu[0][0] === trong[0] && giu[0][1] === trong[1]) };
  });
  var C = gopKhoang([].concat.apply([], tt.filter(function (x) { return !x.doi; }).map(function (x) { return x.giu; })));
  tt.filter(function (x) { return x.doi; })
    .sort(function (x, y) { return uuTienGiu(x.r) - uuTienGiu(y.r); })
    .forEach(function (x) { x.giu = truKhoang(x.giu, C); C = gopKhoang(C.concat(x.giu)); });
  var manh = [];
  tt.forEach(function (x) {
    var m = x.giu.slice();
    if (x.A < d0) m.push([x.A, d0]);
    if (x.B > d1) m.push([d1, x.B]);
    gopKhoang(m).forEach(function (k) { manh.push({ r: x.r, a: k[0], b: k[1] }); });
  });
  /* Dòng đồng bộ chỉ được nối dài khi ngày nhận/trả không đổi, để đồng bộ Airbnb lần sau vẫn nhận ra dòng. */
  function noiDuoc(x, a, b) {
    if (!laDongBo(x.r)) return true;
    return dauNgay(a) >= dauNgay(phut(x.r.bd)) && dauNgay(b) <= dauNgay(phut(x.r.kt));
  }
  var moi = [];
  truKhoang(K, C).forEach(function (u) {
    var truoc = manh.filter(function (x) { return x.b === u[0] && noiDuoc(x, x.a, u[1]); })[0];
    var sau = manh.filter(function (x) { return x.a === u[1] && noiDuoc(x, u[0], x.b); })[0];
    if (truoc) truoc.b = u[1];
    else if (sau) sau.a = u[0];

function dongMoi(p, a, b, ghiChu) {

/* ------------------------------ Booking: nhập mới, sửa thông tin ------------------------------
   Mỗi booking là một dòng trong tab Nhập lịch. Thông tin khách nằm ở cột Ghi chú (chỉ nội bộ, không ra trang tra cứu), dạng:
     Airbnb (tự đồng bộ) | Khách: … | Nguồn: … | SĐT: … | Số khách: … | Thu: … | Cọc: … | Giờ khách: … | Mã: … | Ghi: …
   Nhãn đồng bộ (nếu có) luôn đứng đầu để đồng bộ Airbnb vẫn nhận ra dòng. Các booking sát/chồng giờ KHÔNG gộp với nhau. */
var TRUONG = [['khach', 'Khách'], ['nguon', 'Nguồn'], ['sdt', 'SĐT'], ['soKhach', 'Số khách'], ['thu', 'Thu'], ['coc', 'Cọc'],
  ['gioKhach', 'Giờ khách'], ['ma', 'Mã'], ['ghi', 'Ghi']];
var DS_NGUON = ['Zalo', 'Facebook', 'Instagram', 'Threads', 'Airbnb', 'Agoda', 'GO2JOY', 'Trực tiếp', 'Khác'];

function docGhi(g) {
  var kq = { nhan: '' }, s = String(g || '').trim(), le = [];
  [GHI_CHAN, GHI_AIRBNB].forEach(function (n) {
    if (!kq.nhan && s.indexOf(n) >= 0) { kq.nhan = n; s = s.replace(n, '').replace(/^[\s·|]+/, '').trim(); }
  });
  s.split(' | ').forEach(function (phan) {
    var t = TRUONG.filter(function (x) { return phan.indexOf(x[1] + ': ') === 0; })[0];
    if (t) kq[t[0]] = phan.slice(t[1].length + 2);
    else if (phan) le.push(phan);
  });
  /* Ghi chú cũ chỉ có chữ "Airbnb" / "Agoda": đó là nguồn đặt. */
  le = le.filter(function (x) {
    if (kq.nguon || !/^(airbnb|agoda)$/i.test(x.trim())) return true;
    kq.nguon = /airbnb/i.test(x) ? 'Airbnb' : 'Agoda';
    return false;
  });
  if (le.length) kq.ghi = le.concat(kq.ghi ? [kq.ghi] : []).join(' · ');
  return kq;
}
function taoGhi(t) {
  var ds = t.nhan ? [t.nhan] : [];
  TRUONG.forEach(function (x) {
    var v = String(t[x[0]] == null ? '' : t[x[0]]).replace(/\s*[|\r\n]+\s*/g, ' / ').trim();
    if (v) ds.push(x[1] + ': ' + v);
  });
  return ds.join(' | ');
}
/* Dòng có thông tin khách (khác với ngày chặn / lệnh khoá trơn). */
function coKhach(r) { var t = docGhi(r.ghiChu); return !!(t.khach || t.sdt); }
/* Ngày chặn Airbnb chưa gắn khách: booking mới được thay vào. */
function laChanTron(r) { return String(r.ghiChu).indexOf(GHI_CHAN) >= 0 && !coKhach(r); }
function tenKhach(r) {
  var t = docGhi(r.ghiChu);
  return t.khach || t.sdt || '';
}
function tenLuot(r) {
  var t = docGhi(r.ghiChu);

  if (laChanTron(r) || /^chặn trên Airbnb/i.test(r.ghiChu)) return 'Chặn trên Airbnb';

function doDaiChu(bd, kt) {
  var dem = Math.round((dauNgay(kt) - dauNgay(bd)) / 1440);
  return (dem ? dem + ' đêm · ' : '') + gioGon(kt - bd).replace('h', ' tiếng ').trim().replace(/(\d{2})$/, '$1 phút');
}

/* "808" / "808k" / "1.480k" / "1tr480" / "2tr" / "12.701.500" → số đồng. Để trống → '', không hiểu → null. */
function docTien(chu) {
  var s = String(chu || '').toLowerCase().replace(/\s|vnđ|vnd|₫|đ/g, ''), m, v;
  if (!s) return '';
  if ((m = s.match(/^(\d+(?:[.,]\d+)?)(?:triệu|trieu|tr)(\d{0,3})$/))) {
    v = parseFloat(m[1].replace(',', '.')) * 1e6 + (m[2] ? +(m[2] + '00').slice(0, 3) * 1000 : 0);
  } else if ((m = s.match(/^([\d.,]+)k$/))) {
    if (/^\d{1,3}([.,]\d{3})+$/.test(m[1])) v = +m[1].replace(/[.,]/g, '') * 1000;
    else if (/^\d+([.,]\d+)?$/.test(m[1])) v = parseFloat(m[1].replace(',', '.')) * 1000;
    else return null;
  } else if (/^\d{1,3}([.,]\d{3})+$|^\d+$/.test(s)) {
    v = +s.replace(/[.,]/g, '');
    if (v < 100000) v *= 1000;
  } else return null;
  return Math.round(v);
}

/* Khi booking thay ngày chặn Airbnb: bỏ phần chặn của đúng các đêm khách đặt (đêm = 13:00 → 13:00 hôm sau), giữ đêm khác.

      for (var m = 0; m < 1440; m += 30) ds.push(m);
      if (ds.indexOf(gt) < 0) { ds.push(gt); ds.sort(function (a, b) { return a - b; }); }
      s.textContent = '';
      ds.forEach(function (m) { s.add(new Option(gioPhut(m), m)); });
      s.value = gt;
    };
    var kq = f.querySelector('.kq'), hopPhong = f.querySelector('.chonPhongBk');
    veGio = function () {
      e.ngayVao.value = iso(vao);
      e.ngayRa.value = iso(ra);
      e.ngayRa.min = iso(vao);
      napGio(e.gioVao, vao - dauNgay(vao));
      napGio(e.gioRa, ra - dauNgay(ra));
      f.querySelector('.tongGio').textContent = ra > vao ? doDaiChu(vao, ra) : '—';
      e.botDem.disabled = dauNgay(ra) <= dauNgay(vao) || ra - 1440 <= vao;

      hopPhong.textContent = '';
      DL.phong.forEach(function (p) {
        var trung = ra > vao ? dsTrung(p, vao, ra) : [];
        var that = trung.filter(function (r) { return !laChanTron(r); });
        var b = datMau(nut('', p === phong ? 'on' : '', function () { phong = p; dongYTrung = false; thayChan = true; datMau(box, p); veGio(); }), p);
        b.setAttribute('aria-pressed', p === phong);
        b.appendChild(el('b', null, tenGon(p)));
        b.appendChild(el('small', null, that.length ? '✕ Trùng giờ' : trung.length ? '◐ Đang chặn Airbnb' : '✓ Trống'));
        hopPhong.appendChild(b);
      });

      kq.textContent = '';
      kh = null;
      if (ra <= vao) { kq.appendChild(el('div', 'loiForm', 'Check-out phải sau check-in.')); return; }
      if (!phong) return;
      var ds = dsTrung(phong, vao, ra), chan = ds.filter(laChanTron), khac = ds.filter(function (r) { return !laChanTron(r); });
      kh = { chan: chan, khac: khac };
      function oChon(cls, chu, bat, doi) {
        var l = el('label', 'oChon ' + cls), c = el('input');
        c.type = 'checkbox';
        c.checked = bat;
        c.addEventListener('change', function () { doi(c.checked); veGio(); });

        l.appendChild(el('span', null, chu));
        kq.appendChild(l);
      }
      if (khac.length) {
        kq.appendChild(el('div', 'loiForm', '⚠ Trùng giờ với:\n' + khac.map(function (r) {
          return (tenKhach(r) || tenLuot(r)) + ': ' + moc(phut(r.bd)) + ' → ' + moc(phut(r.kt));
        }).join('\n')));
        oChon('trung', 'Tôi biết đang trùng, vẫn lưu', dongYTrung, function (v) { dongYTrung = v; });
      }
      if (chan.length) {
        var con = [];
        chan.forEach(function (r) { con = con.concat(chanConLai(r, vao, ra)); });
        oChon('chan', 'Đây là khách của ngày đã chặn trên Airbnb: thay phần chặn của các đêm này bằng booking. ' +
          (con.length ? 'Vẫn giữ chặn: ' + con.map(function (x) { return moc(x[0]) + ' → ' + moc(x[1]); }).join('; ') + '.'
            : 'Ngoài giờ khách ở, trang tra cứu sẽ mở bán lại.'), thayChan, function (v) { thayChan = v; });
      }
      if (!ds.length) kq.appendChild(el('div', 'trongOk', '✓ ' + tenGon(phong) + ' trống trọn khung này'));
    };

    /* Đổi ngày check-in thì check-out dời theo cùng số ngày; đổi giờ của lượt trong ngày thì giữ số tiếng. */
    e.ngayVao.addEventListener('change', function () {
      if (!e.ngayVao.value) return;
      var lech = phut(e.ngayVao.value) - dauNgay(vao);
      vao += lech; ra += lech; dongYTrung = false; veGio();
    });
    e.gioVao.addEventListener('change', function () {
      var moi = dauNgay(vao) + +e.gioVao.value;
      if (dauNgay(ra) === dauNgay(vao)) ra += moi - vao;
      vao = moi; dongYTrung = false; veGio();
    });
    e.ngayRa.addEventListener('change', function () {
      if (!e.ngayRa.value) return;
      ra = phut(e.ngayRa.value) + (ra - dauNgay(ra)); dongYTrung = false; veGio();
    });
    e.gioRa.addEventListener('change', function () { ra = dauNgay(ra) + +e.gioRa.value; dongYTrung = false; veGio(); });
    e.themDem.addEventListener('click', function () { ra += 1440; dongYTrung = false; veGio(); });
    e.botDem.addEventListener('click', function () { if (ra - 1440 > vao) ra -= 1440; dongYTrung = false; veGio(); });

    var mau = f.querySelector('.mauGio');
    [['Theo ngày ' + DL.gioNhan + 'h → ' + DL.gioTra + 'h', 0], ['Qua đêm 22h → 11h', 1], ['Combo 3 giờ', 3], ['Combo 6 giờ', 6]].forEach(function (x) {
      mau.appendChild(nut(x[0], null, function () {
        var d = dauNgay(vao), g = vao - d, dem = Math.max(1, Math.round((dauNgay(ra) - d) / 1440));
        if (x[1] === 0) { vao = d + DL.gioNhan * 60; ra = d + dem * 1440 + DL.gioTra * 60; }
        else if (x[1] === 1) { vao = d + 1320; ra = d + 1440 + 660; }
        else {
          if (g < 540 || g + x[1] * 60 > 1260) g = 840;
          vao = d + g; ra = vao + x[1] * 60;
        }
        dongYTrung = false;
        veGio();
      }));
    });
    veGio();
  }

  function hienLoi(s) { loiO.textContent = s; loiO.hidden = !s; if (s) loiO.scrollIntoView({ block: 'nearest' }); }

  f.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var m = { nhan: cu ? t.nhan : '', ma: t.ma || '', gioKhach: t.gioKhach || '', nguon: nguon };
    ['khach', 'sdt', 'soKhach', 'gioKhach', 'ghi'].forEach(function (k) { if (e[k]) m[k] = e[k].value.trim(); });
    var thu = docTien(e.thu.value), coc = docTien(e.coc.value);
    if (thu === null || coc === null) return hienLoi('Chưa hiểu số tiền. Ghi dạng 808k, 1tr480 hoặc 1.480.000.');
    m.thu = String(thu); m.coc = String(coc);

    if (cu) {
      if (DL.dong.indexOf(cu) < 0) {   // lịch vừa tải lại: tìm đúng dòng đó theo chữ ký
        var moiTai = DL.dong.filter(function (r) { return r.dong === cu.dong && r.chuKy === cu.chuKy; })[0];
        if (!moiTai) return hienLoi('Booking này vừa đổi ở nơi khác. Bấm Quay lại rồi mở lại.');
        cu = moiTai;
      }
      var ghiSua = taoGhi(m);
      if (ghiSua.length > 500) return hienLoi('Thông tin quá dài, rút gọn ghi chú giúp mình.');
      hienLoi('');
      return luuBooking({ phong: cu.phong, bd: bd0, kt: kt0, ghiChu: ghiSua, sua: cu, chan: [] });
    }

    veGio();   // tính lại theo lịch mới nhất
    if (!phong) return hienLoi('Chọn phòng.');
    if (!kh) return hienLoi('Check-out phải sau check-in.');
    if (!m.khach && !m.sdt) return hienLoi('Ghi tên khách hoặc SĐT.');
    if (kh.khac.length && !dongYTrung) return hienLoi('Phòng đang trùng giờ. Đổi phòng/giờ, hoặc tick "vẫn lưu".');
    var ghi = taoGhi(m);
    if (ghi.length > 500) return hienLoi('Thông tin quá dài, rút gọn ghi chú giúp mình.');
    hienLoi('');
    luuBooking({ phong: phong, bd: vao, kt: ra, ghiChu: ghi, chan: thayChan ? kh.chan : [], nhap: m });
  });
  byId('phu').hidden = false;
}

/* Lưu một lần (hanh suaNgay): booking và phần ngày chặn được thay đổi cùng lúc. Lỗi thì mở lại form với thông tin vừa nhập. */
function luuBooking(h) {
  var moi = dongMoi(h.phong, h.bd, h.kt, h.ghiChu), sua = [], them = [];
  if (h.sua) sua.push({ r: h.sua, moi: moi }); else them.push(moi);
  h.chan.forEach(function (r) {
    var con = chanConLai(r, h.bd, h.kt).map(function (x) { return dongMoi(r.phong, x[0], x[1], r.ghiChu); });
    sua.push({ r: r, moi: con[0] || null });
    them = them.concat(con.slice(1));
  });
  var bo = sua.map(function (s) { return s.r; });
  DL.dong = DL.dong.filter(function (x) { return bo.indexOf(x) < 0; })
    .concat(sua.filter(function (s) { return s.moi; }).map(function (s) { return s.moi; }), them);
  var xem = NGAY_MO && NGAY_MO.p === h.phong && NGAY_MO.ngay >= dauNgay(h.bd) && NGAY_MO.ngay < h.kt ? NGAY_MO.ngay : dauNgay(h.bd);
  THANG = dauThang(xem);
  CHON = h.phong;
  veChonPhong();
  doiDuLieu();
  moNgay(h.phong, xem);
  byId('ngang').scrollTop = 0;
  xepHang(function () {
    return { hanh: 'suaNgay',
      sua: sua.map(function (s) { return { dong: s.r.dong, chuKy: s.r.chuKy, luot: s.moi ? luotGui(s.moi) : null }; }),
      them: them.map(luotGui) };
  }, function (kq) {
    sua.forEach(function (s, i) { if (s.moi) { s.moi.dong = kq.sua[i].dong; s.moi.chuKy = kq.sua[i].chuKy; s.moi.dang = false; } });
    them.forEach(function (r, i) { r.dong = kq.them[i].dong; r.chuKy = kq.them[i].chuKy; r.dang = false; });
  }, function () {
    if (!h.sua) moBooking({ phong: h.phong, bd: h.bd, kt: h.kt, nhap: h.nhap });
  });
}

function xoaKhoi(k) {
  var ten = tenKhach(k.dong[0]), laBk = !!ten || k.loai === 'airbnb';
  var hoi = (laBk ? 'Huỷ booking ' + (ten ? ten + ' · ' : '') : 'Mở khoá cả lệnh ') + tenGon(k.phong) + ': ' + moc(k.bd) + ' → ' + moc(k.kt) + '?' +
    '\nChỉ muốn đổi giờ một ngày thì bấm "Không" rồi dùng nút Chỉnh giờ kín trong ngày này.';
  if (k.loai === 'airbnb') hoi += '\n\nXoá ở đây chỉ mở phòng trên trang tra cứu, lượt đặt trên Airbnb vẫn giữ nguyên.';
  var coBanChan = k.dong.some(function (r) { return String(r.ghiChu).indexOf(GHI_CHAN) >= 0; });
  if (coBanChan) hoi += '\n\nCó ngày đã chặn trên Airbnb: nhớ mở chặn trên Airbnb nữa, nếu không lần đồng bộ sau sẽ không tự khoá lại nhưng Airbnb vẫn chặn.';
  xacNhan(hoi, laBk ? 'Huỷ booking' : 'Mở khoá cả lệnh', function () {

/* Hỏi lại ngay trong trang. Bấm "Không" thì trả lại nội dung cũ. */

/* ------------------------------ Flash sale ------------------------------
   Chủ nhà nhập đúng giá muốn bán cho từng gói (Combo 3 giờ, Combo 6 giờ, Qua đêm, 2N1Đ; để trống = gói đó không sale),
   cho các phòng và ngày ở đã chọn, tới giờ kết thúc. Trang tra cứu hiện nổi bật giá này kèm % giảm so với giá niêm yết,
   không cộng thêm ưu đãi nào khác; giờ lẻ cộng thêm và phụ thu khách vẫn tính như thường. Lưu trong Script Properties
   (FLASH_SALE), ghi qua hàng đợi như các thao tác khác nên màn hình đổi ngay. */
var TEN_GOI = ['Combo 3 giờ', 'Combo 6 giờ', 'Qua đêm', '2 ngày 1 đêm'];
function tien(n) { return Math.round(n).toLocaleString('vi-VN') + 'đ'; }
function bayGioMay() { return phut(new Date(Date.now() + 7 * 3600000).toISOString().slice(0, 16)); }
function dsFlash() {
  var bg = bayGioMay(), hn = iso(dauNgay(bg));
  return ((DL && DL.flash) || []).filter(function (f) { return phut(f.het) > bg && f.den >= hn; })
    .sort(function (a, b) { return a.tu < b.tu ? -1 : a.tu > b.tu ? 1 : 0; });
}
function flashNgay(p, m) {
  var s = iso(m);
  return dsFlash().filter(function (f) { return f.phong.indexOf(p) >= 0 && s >= f.tu && s <= f.den; });
}
function giaFlashGon(f) {
  return f.gia.map(function (g, i) { return g == null ? '' : TEN_GOI[i] + ' ' + tien(g); }).filter(Boolean).join(' · ');
}
function ngayFlash(f) { return f.tu === f.den ? ngayNgan(phut(f.tu)) : ngayNgan(phut(f.tu)) + ' → ' + ngayNgan(phut(f.den)); }
function conLaiChu(het) {
  var p = Math.max(0, phut(het) - bayGioMay()), n = Math.floor(p / 1440), h = Math.floor(p % 1440 / 60);
  return n ? n + ' ngày ' + h + ' giờ' : h ? h + ' giờ ' + (p % 60) + ' phút' : (p % 60) + ' phút';
}
/* % giảm của giá flash sale so với giá niêm yết (ngày thường, cuối tuần) của các phòng đã chọn. */
function soVoiNiemYet(phong, goi, gia) {
  var ds = [];
  phong.forEach(function (p) {
    var g = DL.gia && DL.gia[p];
    if (!g) return;
    [[g.thuong[goi], ''], [g.cuoiTuan[goi], 'cuối tuần ']].forEach(function (x) {
      if (!x[0] || (x[1] && x[0] === g.thuong[goi])) return;
      var pt = Math.round((1 - gia / x[0]) * 100);
      var s = x[1] + tien(x[0]) + ' → ' + (pt > 0 ? '−' + pt + '%' : 'không rẻ hơn, trang tra cứu sẽ bỏ qua');
      if (ds.indexOf(s) < 0) ds.push((phong.length > 1 ? tenGon(p) + ': ' : '') + s);
    });
  });
  return ds.length ? 'So với niêm yết ' + ds.join(' · ') : '';
}

function moFlash() {

function theFlash(f) {
  var the = el('div', 'luot fsThe' + (f.dang ? ' dang' : ''));

/* Ô giá nhận 350000, 350.000 hoặc 350 (hiểu là 350.000đ). */

    '<div class="hang">' + TEN_GOI.map(function (t, i) {
      return '<label>' + t + '<input type="text" inputmode="numeric" autocomplete="off" name="g' + i + '" placeholder="không sale">' +

    }).join('') + '</div>' +
    '<div class="hang"><label>Kết thúc sale ngày<input type="date" name="hetNgay" required></label>' +
    '<label>Lúc<input type="time" name="hetGio" required></label></div>' +

    'placeholder="để trống = FLASH SALE"></label></div>';
  var chon = form.querySelector('.chonPhongFs');

  var e = form.elements;

  e.hetNgay.value = f.het.slice(0, 10); e.hetGio.value = f.het.slice(11);

  TEN_GOI.forEach(function (t, i) { if (f.gia[i] != null) e['g' + i].value = f.gia[i].toLocaleString('vi-VN'); });
  function phongChon() { return [].filter.call(chon.querySelectorAll('input'), function (x) { return x.checked; }).map(function (x) { return x.value; }); }
  function goiY() {

  box.appendChild(loi);
  box.appendChild(nut(moi ? 'Bật flash sale' : 'Lưu thay đổi', 'nutLon', function () {
    var ph = phongChon(), gia = TEN_GOI.map(function (t, i) { return docGia(e['g' + i].value); });
    var het = e.hetNgay.value + 'T' + e.hetGio.value, sai = '';
    if (!ph.length) sai = 'Chọn ít nhất một phòng.';
    else if (!e.tu.value || !e.den.value || e.den.value < e.tu.value) sai = 'Ngày ở "đến" phải từ ngày "từ" trở đi.';
    else if (e.den.value < hn) sai = 'Ngày ở đã qua.';
    else if (gia.every(function (g) { return g == null; })) sai = 'Nhập giá flash sale cho ít nhất một gói.';
    else if (gia.some(function (g) { return g != null && g < 1000; })) sai = 'Giá flash sale không hợp lệ.';
    else if (!e.hetNgay.value || !e.hetGio.value || phut(het) <= bayGioMay()) sai = 'Giờ kết thúc phải sau bây giờ.';
    loi.hidden = !sai;
    loi.textContent = sai;
    if (sai) return;
    luuFlash({ id: f.id, phong: ph, tu: e.tu.value, den: e.den.value, gia: gia, het: het, ten: e.ten.value.trim() });
  }));
  if (!moi) box.appendChild(nut('Xoá flash sale này', 'nutLon phu2', function () { xoaFlash(f); }));
  byId('phu').hidden = false;
}
function sauKhiLuuFlash(ds) {
  DL.flash = ds;
  if (!byId('phu').hidden && byId('ngang').querySelector('.fsDs')) moFlash();
}
function luuFlash(fs) {
  DL.flash = (DL.flash || []).filter(function (x) { return x.id !== fs.id; }).concat([Object.assign({ dang: true }, fs)]);
  luuDem();
  ve();
  moFlash();
  xepHang(function () { return { hanh: 'luuFlash', fs: fs }; }, sauKhiLuuFlash);
}
function xoaFlash(f) {
  xacNhan('Xoá flash sale ' + (f.ten ? '"' + f.ten + '" ' : '') + '(' + f.phong.map(tenGon).join(', ') + ', ngày ở ' + ngayFlash(f) + ')?\n' +
    'Trang tra cứu sẽ thôi hiện giá flash sale này.', 'Xoá flash sale', function () {
    DL.flash = (DL.flash || []).filter(function (x) { return x.id !== f.id; });
    luuDem();
    ve();
    moFlash();
    xepHang(function () { return { hanh: 'xoaFlash', id: f.id }; }, sauKhiLuuFlash);
  });
}

/* ------------------------------ Gọi máy chủ ------------------------------ */
/* POST dạng text/plain để trình duyệt không gửi preflight (Apps Script không trả lời OPTIONS). */
function goiApi(than) {
  than.khoa = KHOA;
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(than) })
    .then(function (r) { if (!r.ok) throw new Error('máy chủ trả lỗi HTTP ' + r.status); return r.json(); },
      function () { throw new Error('không kết nối được, kiểm tra mạng rồi thử lại'); })
    .then(function (tl) {
      if (tl.khoaSai) { quenKhoa(); hienManKhoa(tl.loi); throw new Error(tl.loi); }
      if (!tl.ok) throw new Error(tl.loi || 'lỗi không rõ');
      return tl.kq;
    });
}

/* Hàng đợi ghi: các thao tác gửi lần lượt; nội dung gửi tạo đúng lúc tới lượt, nên thao tác sau dùng được số dòng thật
   của dòng vừa thêm. Lỗi thì bỏ cả hàng và tải lại lịch từ Sheet. */
var HANG = [], DANG_GUI = false, SO_GHI = 0, henXong;
function xepHang(tao, xong, hong) {
  HANG.push({ tao: tao, xong: xong, hong: hong });
  SO_GHI++;
  trangThai();
  if (!DANG_GUI) chayHang();
}
function chayHang() {
  var v = HANG[0];
  if (!v) { DANG_GUI = false; trangThai(true); return; }
  DANG_GUI = true;
  goiApi(v.tao()).then(function (kq) {
    HANG.shift();
    v.xong(kq);
    luuDem();
    veLai();
    chayHang();
  }, function (e) {
    var bo = HANG;
    HANG = [];
    DANG_GUI = false;
    trangThai();
    if (!KHOA) return;
    bao('Chưa lưu được (' + String(e.message).replace(/\.$/, '') + '). Đang tải lại lịch từ Sheet…', 8000);
    taiLai(false, function () { bo.forEach(function (x) { if (x.hong) x.hong(); }); });
  });
}
function trangThai(vuaXong) {
  var t = byId('trangThai');
  clearTimeout(henXong);
  if (HANG.length) t.textContent = '⏳ Đang lưu…';
  else if (vuaXong) { t.textContent = '✓ Đã lưu'; henXong = setTimeout(function () { t.textContent = ''; }, 2500); }
  else t.textContent = '';
}

function doiDuLieu() { tinhKhoi(); ve(); luuDem(); }
function veLai() {
  tinhKhoi();
  ve();
  var dangSua = byId('ngang').querySelector('form') || /Xác nhận/.test((byId('ngang').querySelector('h3') || {}).textContent || '');
  if (NGAY_MO && !byId('phu').hidden && !dangSua) moNgay(NGAY_MO.p, NGAY_MO.ngay);
}
/* Lưu bản lịch gần nhất trên máy để lần sau mở trang hiện ngay, rồi tự tải bản mới. */
function luuDem() { try { localStorage.setItem(KHO_DL, JSON.stringify(DL)); } catch (e) {} }
function napDL(dl) {
  DL = dl;
  byId('linkSheet').href = DL.linkSheet;
  if (CHON !== 'tat' && DL.phong.indexOf(CHON) < 0) CHON = 'tat';
  luuDem();
}
var DANG_TAI = false;
function taiLai(baoXong, sauDo) {
  if (DANG_TAI || HANG.length) { if (sauDo) sauDo(); return; }
  DANG_TAI = true;
  var lanGhi = SO_GHI;
  var n = byId('nutTaiLai');
  n.disabled = true;
  n.textContent = 'Đang tải…';
  goiApi({ hanh: 'duLieu' }).then(function (dl) {
    var lanDau = !DL;
    if (!lanDau && lanGhi !== SO_GHI) return;   // có thao tác lưu chen vào lúc đang tải: bản tải về đã cũ
    napDL(dl);
    if (lanDau) THANG = dauThang(homNay());
    veChonPhong();
    veLai();
    if (baoXong) bao('Đã tải lịch mới nhất.');
  }, function (e) {
    if (!KHOA) return;
    bao('Lỗi: ' + e.message, 7000);
    if (!DL) { byId('lich').textContent = ''; byId('lich').appendChild(el('div', 'loiTai', 'Không tải được lịch: ' + e.message)); }
  }).then(function () { DANG_TAI = false; n.disabled = false; n.textContent = 'Tải lại'; if (sauDo) sauDo(); });
}
function hienManKhoa(loi) {
  document.body.classList.add('chuaKhoa');
  byId('manKhoa').hidden = false;
  byId('phu').hidden = true;
  byId('loiKhoa').hidden = !loi;
  byId('loiKhoa').textContent = loi || '';
}
var henToast;
function bao(s, ms) {
  var t = byId('toast');
  t.textContent = s;
  t.hidden = false;
  clearTimeout(henToast);
  henToast = setTimeout(function () { t.hidden = true; }, ms || 3000);
}

byId('thangTruoc').addEventListener('click', function () { THANG = themThang(THANG, -1); ve(); });
byId('thangSau').addEventListener('click', function () { THANG = themThang(THANG, 1); ve(); });
byId('veHomNay').addEventListener('click', function () { THANG = dauThang(homNay()); ve(); });
byId('nutTaiLai').addEventListener('click', function () { taiLai(true); });
byId('nutDongBo').addEventListener('click', function () {
  if (HANG.length) { bao('Đang lưu, thử lại sau giây lát.'); return; }
  var n = byId('nutDongBo');
  n.disabled = true;
  n.textContent = 'Đang đồng bộ…';
  goiApi({ hanh: 'dongBo' }).then(function (kq) { napDL(kq.dl); veLai(); bao(kq.kq, 6000); }, function (e) { bao('Lỗi: ' + e.message, 7000); })
    .then(function () { n.disabled = false; n.textContent = '↻ Đồng bộ Airbnb'; });
});
byId('nutFlash').addEventListener('click', function () { if (DL) moFlash(); });
/* Đang nhập booking thì chạm nhầm ra ngoài không đóng form (khỏi mất thông tin đang gõ): bấm Quay lại. */
function dangNhapBooking() { return !!byId('ngang').querySelector('form.booking'); }
byId('phu').addEventListener('click', function (e) { if (e.target === byId('phu') && !dangNhapBooking()) dongPhu(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !byId('phu').hidden && !dangNhapBooking()) dongPhu(); });
byId('nutBooking').addEventListener('click', function () {
  if (!DL) return;
  NGAY_MO = null;
  moBooking({ phong: CHON === 'tat' ? '' : CHON });
});
/* Quay lại trang (vd từ app khác trên điện thoại) thì tải lại cho chắc. */
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && DL && KHOA) taiLai(false);
  if (document.visibilityState === 'visible') kiemBanMoi();
});
function kiemBanMoi() {
  fetch(location.pathname, { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (t) {
    var m = t.match(/BAN_TRANG = '(\d{4}-\d{2}-\d{2}\w*)'/);
    if (m && m[1] !== BAN_TRANG) byId('nutBanMoi').hidden = false;
  }).catch(function () {});
}
byId('nutBanMoi').addEventListener('click', function () {
  if (HANG.length) { bao('Đang lưu, đợi xong rồi bấm lại.'); return; }
  location.reload();
});
setTimeout(kiemBanMoi, 3000);
setInterval(kiemBanMoi, 30 * 60000);
window.addEventListener('beforeunload', function (e) { if (HANG.length) { e.preventDefault(); e.returnValue = ''; } });

byId('nutThoat').addEventListener('click', function () { quenKhoa(); location.reload(); });
byId('nutKhoa').addEventListener('click', function () {
  var k = layKhoa(byId('oKhoa').value);
  if (!k) { byId('loiKhoa').hidden = false; byId('loiKhoa').textContent = 'Link chưa đúng, bạn dán lại cả link nhé.'; return; }
  try { localStorage.setItem(KHO_KHOA, k); } catch (e) {}
  KHOA = k;
  location.reload();
});
byId('oKhoa').addEventListener('keydown', function (e) { if (e.key === 'Enter') byId('nutKhoa').click(); });

if (!KHOA) hienManKhoa('');
else {
  try {
    var dem = JSON.parse(localStorage.getItem(KHO_DL) || 'null');
    if (dem && dem.dong) {
      dem.dong = dem.dong.filter(function (r) { return !r.dang; });
      DL = dem; byId('linkSheet').href = DL.linkSheet; THANG = dauThang(homNay()); tinhKhoi(); veChonPhong(); ve();
    }
  } catch (e) {}
  taiLai(false);
}
</script>
</body>
</html>
