<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%3E%3Ctext%20y%3D'.9em'%20font-size%3D'90'%3E%F0%9F%97%93%3C%2Ftext%3E%3C%2Fsvg%3E">

<title>Monaca · Quản lý lịch phòng</title>
<style>
  /* Trang nội bộ: ưu tiên dễ đọc (nền trắng, chữ đen, chữ to). Mỗi phòng một màu (--mp đậm, --mn nhạt), đặt theo phòng
     ở mauPhong(). Lượt Airbnb tô màu đậm, tự khoá tô màu nhạt của phòng; phần xám nhạt trên thanh là giờ còn trống. */
  :root {
    --nen: #F3F4F6; --the: #FFFFFF; --chu: #111111; --phu: #4B5563; --vach: #CBD5E1; --trongThanh: #E5E7EB;
    --homNay: #F59E0B; --dau: #1F2937; --mp: #6B7280; --mn: #F3F4F6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--nen); color: var(--chu); }
  body { font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding-bottom: 40px; }
  button { font: inherit; cursor: pointer; color: inherit; }
  header { position: sticky; top: 0; z-index: 20; background: var(--dau); color: #fff; padding: 10px 14px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; flex: 1 1 auto; font-weight: 700; }
  header .nutNho { background: #374151; color: #fff; border-color: #4B5563; }
  .trangThai { font-size: 13px; white-space: nowrap; font-weight: 600; }
  .nutNho { border: 1px solid var(--vach); background: var(--the); color: var(--chu); border-radius: 8px; padding: 7px 12px;
    font-size: 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .nutNho:disabled { opacity: .55; cursor: default; }
  .khung { max-width: 1100px; margin: 0 auto; padding: 12px 14px; }
  .chonPhong { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .chonPhong button { border: 2px solid var(--mp); background: var(--the); color: var(--mp); border-radius: 8px; padding: 7px 14px;
    white-space: nowrap; font-weight: 700; }
  .chonPhong button.on { background: var(--mp); color: #fff; }
  .chonPhong button.tat { --mp: #111111; }
  .thanhThang { display: flex; align-items: center; gap: 8px; margin: 12px 0 6px; flex-wrap: wrap; }
  .thanhThang h2 { margin: 0; font-size: 20px; min-width: 160px; text-align: center; }
  .thanhThang .mui { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--vach); background: var(--the); font-size: 20px; line-height: 1; }
  .chuGiai { display: flex; gap: 14px; flex-wrap: wrap; color: var(--phu); font-size: 13px; margin: 4px 0 10px; }
  .chuGiai span { display: inline-flex; align-items: center; gap: 6px; }
  .chuGiai i { width: 22px; height: 10px; border-radius: 2px; display: inline-block; --mp: #374151; --mn: #D1D5DB; }
  .chuGiai i.trong { background: var(--trongThanh); border: 1px solid var(--vach); }
  .airbnb { background: var(--mp); }
  .tu { background: var(--mn); background: color-mix(in srgb, var(--mp) 40%, #fff); }

  /* Lịch tháng của một phòng */
  .luoi { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .luoi .thu { text-align: center; font-size: 13px; font-weight: 700; color: var(--phu); padding: 2px 0; }
  .o { position: relative; border: 1px solid var(--vach); background: var(--the); border-radius: 8px; min-height: 78px;
    padding: 5px 6px 6px; text-align: left; display: flex; flex-direction: column; gap: 4px; color: var(--chu); }
  .o:hover { border-color: var(--chu); }
  .o.kin { background: var(--mn); border-color: var(--mp); }
  .o.ngoai { visibility: hidden; }
  .o.qua { opacity: .45; }
  .o.homNay { box-shadow: inset 0 0 0 3px var(--homNay); }
  .o.chon { box-shadow: inset 0 0 0 3px var(--chu); }
  .o .so { font-weight: 700; font-size: 15px; }
  .o .tt { font-size: 12px; font-weight: 700; color: var(--chu); line-height: 1.2; word-break: break-word; }
  .o.kin .tt { color: var(--mp); }
  .thanh { display: block; position: relative; height: 10px; background: var(--trongThanh); border-radius: 3px; overflow: hidden; }
  .thanh i { position: absolute; top: 0; bottom: 0; }
  .thanh i.dang { opacity: .5; }

  /* Bảng tổng quan cả các phòng */
  .bang { overflow-x: auto; border: 1px solid var(--vach); border-radius: 10px; background: var(--the); }
  .bang table { border-collapse: separate; border-spacing: 0; min-width: 100%; }
  .bang th, .bang td { padding: 0; border-bottom: 1px solid var(--vach); }
  .bang th.ten { position: sticky; left: 0; z-index: 2; background: var(--the); text-align: left; padding: 6px 10px;
    font-size: 13px; font-weight: 700; color: var(--mp); min-width: 112px; max-width: 140px; border-right: 1px solid var(--vach);
    border-left: 6px solid var(--mp); }
  .bang thead th { font-size: 12px; color: var(--phu); font-weight: 600; padding: 4px 0; text-align: center; min-width: 40px; }
  .bang thead th.ten { border-left-color: transparent; color: var(--phu); }
  .bang thead th.cuoiTuan { color: var(--chu); background: #F9FAFB; }
  .bang thead th.homNay { color: #111; background: var(--homNay); border-radius: 6px 6px 0 0; }
  .bang td button { display: block; width: 40px; height: 50px; border: 0; border-left: 1px solid #EEF0F3; background: var(--the); padding: 5px 5px; }
  .bang td button.kin { background: var(--mn); }
  .bang td button.qua { opacity: .45; }
  .bang td button .thanh { height: 38px; border-radius: 3px; }
  .bang td button .thanh i { left: 0; right: 0; top: auto; bottom: auto; }

  /* Bảng chi tiết một ngày */
  .phu { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 30; display: flex; justify-content: flex-end; }
  .phu[hidden] { display: none; }
  .ngang { background: var(--the); width: min(460px, 100%); height: 100%; overflow-y: auto; padding: 16px; border-top: 6px solid var(--mp);
    box-shadow: -4px 0 18px rgba(0,0,0,.18); }
  @media (max-width: 640px) {
    .phu { align-items: flex-end; }
    .ngang { width: 100%; height: auto; max-height: 90vh; border-radius: 14px 14px 0 0; }
    .o { min-height: 66px; padding: 4px; border-radius: 6px; }
    .o .so { font-size: 14px; }
    .o .tt { font-size: 11px; }
    .luoi { gap: 3px; }
    header h1 { font-size: 15px; flex-basis: 100%; }
  }
  .ngang h3 { margin: 0 0 2px; font-size: 18px; color: var(--mp); }
  .ngang .phuDe { color: var(--chu); font-weight: 600; font-size: 14px; margin: 0 0 10px; }
  .dongX { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .dong24 { margin: 10px 0 10px; }
  .dong24 .thanh { height: 22px; border-radius: 5px; }
  .moc { display: flex; justify-content: space-between; font-size: 11px; color: var(--phu); margin-top: 2px; }
  .conTrong { font-weight: 800; font-size: 17px; margin: 4px 0 12px; color: #047857; }
  .conTrong.het { color: #B91C1C; }
  .conTrong small { display: block; font-weight: 600; font-size: 14px; color: var(--chu); }
  .luot { background: var(--the); border: 1px solid var(--vach); border-left: 8px solid var(--mp); border-radius: 8px; padding: 9px 11px; margin-bottom: 8px; }
  .luot.l-tu { border-left-color: var(--mn); border-left-color: color-mix(in srgb, var(--mp) 40%, #fff); }
  .luot.dang { opacity: .6; }
  .luot .nhanLoai { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; color: var(--phu); }
  .luot .gioLuot { font-weight: 700; font-size: 15px; margin: 2px 0; }
  .luot .ghi { color: var(--phu); font-size: 13px; }
  .luot .nut { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
  .nutLon { width: 100%; border: 0; border-radius: 10px; padding: 13px; background: var(--dau); color: #fff; font-weight: 700; margin-top: 6px; font-size: 15px; }
  .nutLon.phu2 { background: var(--the); color: var(--dau); border: 2px solid var(--dau); }

  /* Form khoá / sửa */
  form .hang { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--phu); }
  form input, form select { font: inherit; color: var(--chu); border: 1px solid #9CA3AF; border-radius: 8px; padding: 10px; background: var(--the); width: 100%; }
  form input[readonly], form select:disabled { background: #F3F4F6; color: var(--phu); }
  form .rong { grid-column: 1 / -1; }
  .goiY { display: flex; gap: 6px; flex-wrap: wrap; margin: -4px 0 10px; }
  .goiY button { border: 1px dashed #9CA3AF; background: var(--the); border-radius: 999px; padding: 5px 10px; font-size: 13px; }
  .canhBao { background: #FEF3C7; color: #78350F; border-radius: 8px; padding: 8px 10px; font-size: 14px; margin-bottom: 10px; white-space: pre-line; }
  .ghiChuGop { background: #DBEAFE; color: #1E3A8A; border-radius: 8px; padding: 8px 10px; font-size: 14px; margin-bottom: 10px; }
  .loiForm { background: #FEE2E2; color: #991B1B; border-radius: 8px; padding: 8px 10px; font-size: 14px; margin-bottom: 10px; }
  .nhoNhe { font-size: 13px; color: var(--phu); margin: 0 0 10px; }

  /* Flash sale */
  header .nutNho.fsNut { background: linear-gradient(135deg, #E11D48, #F97316); border-color: transparent; font-weight: 700; }
  .fsO { position: absolute; top: 4px; right: 5px; font-size: 13px; line-height: 1; }
  .bang td button { position: relative; }
  .bang td button .fsO { top: 1px; right: 1px; font-size: 10px; }
  .luot.fsThe { border-left-color: #E11D48; }
  .fsGia { font-size: 14px; margin: 4px 0; }
  .fsGia b, .goiYGia b { color: #E11D48; }
  .fsNgay { background: #FFE4E6; color: #9F1239; border-radius: 8px; padding: 8px 10px; font-size: 14px; margin-bottom: 10px; }
  .chonPhongFs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  form .chonPhongFs label { flex-direction: row; align-items: center; gap: 6px; border: 2px solid var(--mp); color: var(--mp); border-radius: 8px;
    padding: 6px 10px; font-weight: 700; font-size: 14px; }
  form .chonPhongFs input { width: auto; padding: 0; }
  .goiYGia { font-size: 12px; font-weight: 500; color: var(--phu); min-height: 16px; }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #111827; color: #fff; padding: 11px 16px;
    border-radius: 8px; z-index: 50; max-width: 92vw; font-size: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .dangTai { text-align: center; color: var(--phu); padding: 40px 0; }
  .loiTai { background: #FEE2E2; color: #991B1B; border-radius: 10px; padding: 14px; margin-top: 12px; }
  body.chuaKhoa .canKhoa { display: none; }
  .the { background: var(--the); border: 1px solid var(--vach); border-radius: 12px; padding: 18px; margin-top: 18px; }
  .the h2 { margin: 0 0 8px; font-size: 18px; }
  .the p { color: var(--phu); margin: 0 0 12px; }
  .the input { font: inherit; width: 100%; border: 1px solid #9CA3AF; border-radius: 8px; padding: 10px; margin-bottom: 4px; }
</style>

</head>
<body>
<header>
  <h1>🗓 Monaca · Quản lý lịch phòng</h1>
  <span class="trangThai canKhoa" id="trangThai" aria-live="polite"></span>
  <button class="nutNho canKhoa fsNut" id="nutFlash" type="button">⚡ Flash sale</button>
  <button class="nutNho canKhoa" id="nutDongBo" type="button" title="Đọc lịch Airbnb ngay">↻ Đồng bộ Airbnb</button>
  <button class="nutNho canKhoa" id="nutTaiLai" type="button">Tải lại</button>
  <a class="nutNho canKhoa" id="linkSheet" target="_blank" rel="noopener">Mở Sheet ↗</a>
  <button class="nutNho canKhoa" id="nutThoat" type="button" title="Xoá khoá quản lý khỏi máy này">Thoát</button>
</header>
<div class="khung" id="manKhoa" hidden>
  <div class="the">
    <h2>Mở trang quản lý lịch</h2>
    <p>Dán link quản lý vào ô dưới (lấy trong Sheet: menu 🏡 Homestay → 🗓 Trang quản lý lịch). Trang sẽ nhớ trên máy này.</p>
    <div class="loiTai" id="loiKhoa" hidden></div>
    <input id="oKhoa" type="text" autocomplete="off" placeholder="https://monacasaigon.github.io/tra-cuu/quan-ly/#khoa=…">
    <button class="nutLon" id="nutKhoa" type="button">Mở lịch</button>
  </div>
</div>
<div class="khung canKhoa" id="manChinh">
  <div class="chonPhong" id="chonPhong"></div>
  <div class="thanhThang">
    <button class="mui" id="thangTruoc" type="button" aria-label="Tháng trước">‹</button>
    <h2 id="tenThang"></h2>
    <button class="mui" id="thangSau" type="button" aria-label="Tháng sau">›</button>
    <button class="nutNho" id="veHomNay" type="button">Hôm nay</button>
  </div>
  <div class="chuGiai">
    <span><i class="airbnb"></i>Màu đậm: khách đặt Airbnb</span>
    <span><i class="tu"></i>Màu nhạt: tự khoá</span>
    <span><i class="trong"></i>Xám nhạt: còn trống (thanh 0h → 24h)</span>
  </div>
  <div id="lich"><p class="dangTai">Đang tải lịch…</p></div>
</div>

<div class="phu" id="phu" hidden>
  <div class="ngang" id="ngang" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* API: web app Apps Script (Execute as me, Anyone), hàm doPost. Mọi thao tác kèm khoá bí mật của chủ nhà. */
var API = 'https://script.google.com/macros/s/AKfycbxlyugzghvFzZNkScF2WmAJDVKNSbyo2CA06NLzREdQJ3chM_xY87QUMlzLMkPrdPNU/exec';
/* Khoá nằm sau dấu # của link (không gửi lên máy chủ GitHub), lưu lại trên máy rồi xoá khỏi thanh địa chỉ. */
var KHO_KHOA = 'monacaQuanLyKhoa', KHO_DL = 'monacaQuanLyDL';
function layKhoa(s) { var m = String(s || '').match(/(?:khoa=)?([0-9a-f]{32,})/i); return m ? m[1].toLowerCase() : ''; }
var KHOA = (function () {
  var k = layKhoa(location.hash);
  if (k) {
    try { localStorage.setItem(KHO_KHOA, k); } catch (e) {}
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    return k;
  }
  try { return localStorage.getItem(KHO_KHOA) || ''; } catch (e) { return ''; }
})();
function quenKhoa() {
  KHOA = '';
  try { localStorage.removeItem(KHO_KHOA); localStorage.removeItem(KHO_DL); } catch (e) {}
}

var DL = null, KHOI = {}, CHON = 'tat', THANG = 0, NGAY_MO = null;
var THU = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];

function byId(id) { return document.getElementById(id); }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function nut(chu, cls, bam) { var b = el('button', cls || 'nutNho', chu); b.type = 'button'; if (bam) b.addEventListener('click', bam); return b; }
/* Mốc thời gian tính bằng phút theo giờ Việt Nam (Date.UTC để không lệch theo múi giờ của máy). */
function phut(s) { var p = s.split('T'), d = p[0].split('-'), t = (p[1] || '00:00').split(':'); return Date.UTC(+d[0], +d[1] - 1, +d[2], +t[0], +t[1]) / 60000; }
function iso(m) { return new Date(m * 60000).toISOString().slice(0, 10); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function gioPhut(m) { var x = ((m % 1440) + 1440) % 1440; return pad(Math.floor(x / 60)) + ':' + pad(x % 60); }
function thu(m) { return new Date(m * 60000).getUTCDay(); }
function dauNgay(m) { return Math.floor(m / 1440) * 1440; }
function ngayNgan(m) { var d = new Date(m * 60000); return THU[d.getUTCDay()] + ' ' + d.getUTCDate() + '/' + (d.getUTCMonth() + 1); }
function ngayDu(m) { var d = new Date(m * 60000); return THU[d.getUTCDay()] + ' ' + pad(d.getUTCDate()) + '/' + pad(d.getUTCMonth() + 1) + '/' + d.getUTCFullYear(); }
function moc(m) { return gioPhut(m) + ' ' + ngayNgan(dauNgay(m)); }
function dauThang(m) { var d = new Date(m * 60000); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1) / 60000; }
function themThang(m, n) { var d = new Date(m * 60000); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + n, 1) / 60000; }
function tenGon(p) { return String(p).replace(/^Phòng\s*/, ''); }
function homNay() { return dauNgay(phut(DL.bayGio)); }
/* 750 phút → "12h30", 720 → "12h"; 24:00 ghi là 24h. */
function gioGon(m) { var h = Math.floor(m / 60), p = m % 60; return h + 'h' + (p ? pad(p) : ''); }
function khoang(a, b) { return gioGon(a) + '–' + gioGon(b); }

/* Chỉ hai loại: lượt khách đặt trên Airbnb — ghi chú có chữ "Airbnb" (chủ nhà tự ghi "Airbnb" hoặc đồng bộ về
   "Airbnb (tự đồng bộ)") — và tự khoá: mọi lượt còn lại, kể cả ngày tự chặn trên Airbnb ("Airbnb chặn (tự đồng bộ)"). */
var GHI_AIRBNB = 'Airbnb (tự đồng bộ)', GHI_CHAN = 'Airbnb chặn (tự đồng bộ)';
function loai(r) { var g = String(r.ghiChu); return /airbnb/i.test(g) && g.indexOf('chặn') < 0 ? 'airbnb' : 'tu'; }
/* Dòng do đồng bộ Airbnb tạo ra (lượt đặt hoặc ngày chặn): giữ nguyên ghi chú đồng bộ khi sửa để lần sau vẫn nhận ra. */
function laDongBo(r) { return /\(tự đồng bộ\)/.test(String(r.ghiChu)); }
function nhanDongBo(r) { return String(r.ghiChu).indexOf(GHI_CHAN) >= 0 ? GHI_CHAN : GHI_AIRBNB; }
var TEN_LOAI = { airbnb: 'Airbnb · khách đặt', tu: 'Tự khoá' };

/* Mỗi phòng một màu [đậm, nhạt]: 101 đỏ tươi, 201 xanh dương cyan, 202 xanh lá, 301 nâu. */
var MAU_PHONG = { '101': ['#E11D2E', '#FDE3E5'], '201': ['#0891B2', '#DDF4FA'], '202': ['#16A34A', '#E3F6EA'], '301': ['#8B5A2B', '#F2E7DC'] };
function datMau(nutHtml, p) {
  var m = MAU_PHONG[(String(p).match(/\d+/) || [])[0]] || ['#6B7280', '#F3F4F6'];
  nutHtml.style.setProperty('--mp', m[0]);
  nutHtml.style.setProperty('--mn', m[1]);
  return nutHtml;
}

/* Khối khoá của từng phòng: mọi lượt chồng giờ lên nhau, khác loại cũng vậy, gộp thành một khối để trang chỉ hiện một
   lệnh cho cùng một khoảng thời gian. Tự khoá nối liền tự khoá cũng gộp; hai lượt Airbnb nối tiếp (khách trước trả 13:00,
   khách sau nhận 13:00) thì giữ riêng. Khối có lượt Airbnb thì tính là Airbnb. k.ds giữ từng lượt để vẽ thanh đúng loại. */
function tinhKhoi() {
  KHOI = {};
  DL.phong.forEach(function (p) { KHOI[p] = []; });
  var ds = DL.dong.filter(function (r) { return r.bd && r.kt && KHOI[r.phong]; })
    .map(function (r) { return { r: r, bd: phut(r.bd), kt: phut(r.kt), loai: loai(r) }; })
    .filter(function (l) { return l.kt > l.bd; })
    .sort(function (a, b) { return a.bd - b.bd || a.kt - b.kt; });
  var cuoi = {};
  ds.forEach(function (l) {
    var k = cuoi[l.r.phong];
    if (k && (l.bd < k.kt || (l.bd === k.kt && l.loai === 'tu' && k.loai === 'tu'))) {
      k.kt = Math.max(k.kt, l.kt); k.dong.push(l.r); k.ds.push(l);
      if (l.loai === 'airbnb') k.loai = 'airbnb';
    } else {
      k = { phong: l.r.phong, loai: l.loai, bd: l.bd, kt: l.kt, dong: [l.r], ds: [l] };

function dongTu(k) { return k.dong.filter(function (r) { return loai(r) === 'tu'; }); }
/* Phần các khối nằm trong ngày [ngay, ngay + 1440), tính bằng phút trong ngày. */
function trongNgay(p, ngay) {
  var kq = [];
  (KHOI[p] || []).forEach(function (k) {
    var a = Math.max(k.bd, ngay), b = Math.min(k.kt, ngay + 1440);
    if (b > a) kq.push({ k: k, a: a - ngay, b: b - ngay, ngay: ngay });

}
/* Các khoảng còn trống trong ngày (không phân biệt loại khoá). */
function khoangTrong(doan) {
  var gop = [];
  doan.slice().sort(function (x, y) { return x.a - y.a; }).forEach(function (d) {
    var c = gop[gop.length - 1];
    if (c && d.a <= c[1]) c[1] = Math.max(c[1], d.b); else gop.push([d.a, d.b]);
  });
  var trong = [], tu = 0;
  gop.forEach(function (x) { if (x[0] > tu) trong.push([tu, x[0]]); tu = Math.max(tu, x[1]); });
  if (tu < 1440) trong.push([tu, 1440]);
  return trong;
}
function moTaNgay(doan) {
  var trong = khoangTrong(doan), tong = trong.reduce(function (s, x) { return s + x[1] - x[0]; }, 0);
  if (!doan.length) return { cls: '', chu: '', tong: 1440, trong: trong };
  if (tong <= 0) return { cls: 'kin', chu: 'Kín', tong: 0, trong: [] };
  return { cls: 'mot', chu: 'Trống ' + gioGon(tong), tong: tong, trong: trong };
}
function dangLuu(k) { return k.dong.some(function (r) { return r.dang; }); }
/* Vẽ từng lượt trong khối theo đúng loại: Airbnb màu đậm, tự khoá màu nhạt chỉ ở phần Airbnb chưa phủ. */
function veThanh(thanh, doan, laQua, doc) {
  doan.forEach(function (d) {
    var cat = function (l) { return [Math.max(l.bd, d.ngay) - d.ngay, Math.min(l.kt, d.ngay + 1440) - d.ngay]; };
    var phu = d.k.ds.filter(function (l) { return l.loai === 'airbnb'; }).map(cat);
    d.k.ds.forEach(function (l) {
      var manh = [cat(l)];
      if (l.loai === 'tu') phu.forEach(function (c) {
        manh = [].concat.apply([], manh.map(function (m) { return [[m[0], Math.min(m[1], c[0])], [Math.max(m[0], c[1]), m[1]]]; }));
      });
      manh.forEach(function (m) {
        var a = m[0], b = m[1];
        if (b <= a) return;
        var i = el('i', l.loai + (laQua ? ' qua' : '') + (l.r.dang ? ' dang' : ''));
        if (doc) { i.style.top = (a / 14.4) + '%'; i.style.height = ((b - a) / 14.4) + '%'; }
        else { i.style.left = (a / 14.4) + '%'; i.style.width = ((b - a) / 14.4) + '%'; }
        thanh.appendChild(i);
      });
    });
  });
}

/* ------------------------------ Vẽ ------------------------------ */

/* Ghi chú của khối: bỏ nhãn đồng bộ, gộp các ghi chú khác nhau, báo số lệnh đã gộp. */
function ghiChuKhoi(k) {

  k.dong.forEach(function (r) {

  var tu = dongTu(k).length, tron = k.loai === 'airbnb' && tu ? ' (có ' + tu + ' lệnh tự khoá trùng)' : '';
  return ghi.join(' · ') + (k.dong.length > 1 ? (ghi.length ? ' · ' : '') + 'gộp ' + k.dong.length + ' lệnh' + tron : '');

function dongPhu() { byId('phu').hidden = true; NGAY_MO = null; if (DL && CHON !== 'tat') ve(); }

/* ------------------------------ Form khoá / sửa ------------------------------ */

function moFormKhoi(k) {

/* lo = 'tu' | 'airbnb'; thay = các dòng sẽ được thay bằng lượt này (khối đang sửa). Tự khoá chồng/nối với tự khoá khác

/* ------------------------------ Flash sale ------------------------------
   Chủ nhà nhập đúng giá muốn bán cho từng gói (Combo 3 giờ, Combo 6 giờ, Qua đêm, 2N1Đ; để trống = gói đó không sale),
   cho các phòng và ngày ở đã chọn, tới giờ kết thúc. Trang tra cứu hiện nổi bật giá này kèm % giảm so với giá niêm yết,
   không cộng thêm ưu đãi nào khác; giờ lẻ cộng thêm và phụ thu khách vẫn tính như thường. Lưu trong Script Properties
   (FLASH_SALE), ghi qua hàng đợi như các thao tác khác nên màn hình đổi ngay. */
var TEN_GOI = ['Combo 3 giờ', 'Combo 6 giờ', 'Qua đêm', '2 ngày 1 đêm'];
function tien(n) { return Math.round(n).toLocaleString('vi-VN') + 'đ'; }
function bayGioMay() { return phut(new Date(Date.now() + 7 * 3600000).toISOString().slice(0, 16)); }
function dsFlash() {
  var bg = bayGioMay(), hn = iso(dauNgay(bg));
  return ((DL && DL.flash) || []).filter(function (f) { return phut(f.het) > bg && f.den >= hn; })
    .sort(function (a, b) { return a.tu < b.tu ? -1 : a.tu > b.tu ? 1 : 0; });
}
function flashNgay(p, m) {
  var s = iso(m);
  return dsFlash().filter(function (f) { return f.phong.indexOf(p) >= 0 && s >= f.tu && s <= f.den; });
}
function giaFlashGon(f) {
  return f.gia.map(function (g, i) { return g == null ? '' : TEN_GOI[i] + ' ' + tien(g); }).filter(Boolean).join(' · ');
}
function ngayFlash(f) { return f.tu === f.den ? ngayNgan(phut(f.tu)) : ngayNgan(phut(f.tu)) + ' → ' + ngayNgan(phut(f.den)); }
function conLaiChu(het) {
  var p = Math.max(0, phut(het) - bayGioMay()), n = Math.floor(p / 1440), h = Math.floor(p % 1440 / 60);
  return n ? n + ' ngày ' + h + ' giờ' : h ? h + ' giờ ' + (p % 60) + ' phút' : (p % 60) + ' phút';
}
/* % giảm của giá flash sale so với giá niêm yết (ngày thường, cuối tuần) của các phòng đã chọn. */
function soVoiNiemYet(phong, goi, gia) {
  var ds = [];
  phong.forEach(function (p) {
    var g = DL.gia && DL.gia[p];
    if (!g) return;
    [[g.thuong[goi], ''], [g.cuoiTuan[goi], 'cuối tuần ']].forEach(function (x) {
      if (!x[0] || (x[1] && x[0] === g.thuong[goi])) return;
      var pt = Math.round((1 - gia / x[0]) * 100);
      var s = x[1] + tien(x[0]) + ' → ' + (pt > 0 ? '−' + pt + '%' : 'không rẻ hơn, trang tra cứu sẽ bỏ qua');
      if (ds.indexOf(s) < 0) ds.push((phong.length > 1 ? tenGon(p) + ': ' : '') + s);
    });
  });
  return ds.length ? 'So với niêm yết ' + ds.join(' · ') : '';
}

function moFlash() {
  NGAY_MO = null;
  var box = byId('ngang');

    '(giờ lẻ cộng thêm và phụ thu khách vẫn tính như thường). Hết giờ kết thúc thì tự tắt.'));

function theFlash(f) {

/* Ô giá nhận 350000, 350.000 hoặc 350 (hiểu là 350.000đ). */

  var chon = form.querySelector('.chonPhongFs');
  DL.phong.forEach(function (p) {

  var e = form.elements;

  function phongChon() { return [].filter.call(chon.querySelectorAll('input'), function (x) { return x.checked; }).map(function (x) { return x.value; }); }
  function goiY() {

/* ------------------------------ Gọi máy chủ ------------------------------ */
/* POST dạng text/plain để trình duyệt không gửi preflight (Apps Script không trả lời OPTIONS). */
function goiApi(than) {
  than.khoa = KHOA;
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(than) })
    .then(function (r) { if (!r.ok) throw new Error('máy chủ trả lỗi HTTP ' + r.status); return r.json(); },
      function () { throw new Error('không kết nối được, kiểm tra mạng rồi thử lại'); })
    .then(function (tl) {
      if (tl.khoaSai) { quenKhoa(); hienManKhoa(tl.loi); throw new Error(tl.loi); }
      if (!tl.ok) throw new Error(tl.loi || 'lỗi không rõ');
      return tl.kq;
    });
}

/* Hàng đợi ghi: các thao tác gửi lần lượt; nội dung gửi tạo đúng lúc tới lượt, nên thao tác sau dùng được số dòng thật
   của dòng vừa thêm. Lỗi thì bỏ cả hàng và tải lại lịch từ Sheet. */
var HANG = [], DANG_GUI = false, henXong;
function xepHang(tao, xong) {
  HANG.push({ tao: tao, xong: xong });
  trangThai();
  if (!DANG_GUI) chayHang();
}
function chayHang() {
  var v = HANG[0];
  if (!v) { DANG_GUI = false; trangThai(true); return; }
  DANG_GUI = true;
  goiApi(v.tao()).then(function (kq) {
    HANG.shift();
    v.xong(kq);
    luuDem();
    veLai();
    chayHang();
  }, function (e) {
    HANG = [];
    DANG_GUI = false;
    trangThai();
    if (!KHOA) return;
    bao('Chưa lưu được (' + String(e.message).replace(/\.$/, '') + '). Đang tải lại lịch từ Sheet…', 8000);
    taiLai(false);
  });
}
function trangThai(vuaXong) {
  var t = byId('trangThai');

/* Lưu bản lịch gần nhất trên máy để lần sau mở trang hiện ngay, rồi tự tải bản mới. */
