<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monaca Homestay · Tra cứu phòng trống</title>
<meta name="description" content="Chọn ngày ở, xem ngay phòng nào của Monaca Homestay còn trống và giá cho đúng ngày bạn chọn.">
<meta property="og:title" content="Monaca Homestay · Tra cứu phòng trống">
<meta property="og:description" content="Chọn ngày ở, xem ngay phòng nào còn trống và giá cho đúng ngày bạn chọn.">
<meta name="theme-color" content="#790013">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%3E%3Ctext%20y%3D'.9em'%20font-size%3D'90'%3E%F0%9F%93%85%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://wsrv.nl">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<script>
/* Gọi Sheet ngay khi mở trang, trước khi tải font: Sheet trả dữ liệu mất vài giây, khách chọn ngày trong lúc chờ. */
var API = 'https://script.google.com/macros/s/AKfycbyHN4mRMvgDdwTQwvVwj015MBfmh0Ui5Z0zR1iXGwd3dWdYGHDssv0HttQcF34slNp3/exec?format=json';
var TAI_LICH = null;
try {
  TAI_LICH = fetch(API, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  TAI_LICH.catch(function () {});
} catch (e) {}
</script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --dam: #55000D; --dau: #790013; --dauNhat: #9B1B2A; --nen: #FBF5F3; --nhat: #F6ECEB; --the: #FFFFFF;
    --chu: #2B1A1C; --phu: #7D6A6C; --vien: #ECDCDC;
    --xanh: #E2F2E6; --xanhChu: #1E6B3A; --vang: #FCEFD2; --vangChu: #85570A; --do: #F6E0E2; --doChu: #790013;
    --oTrong: #BFE3CB; --oDat: #790013; --oQua: #EEE6E6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--nen); color: var(--chu); font: 15px/1.5 'Lexend', system-ui, -apple-system, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  .hero { position: relative; background: linear-gradient(135deg, var(--dam), var(--dau) 60%, var(--dauNhat)); color: #fff; border-radius: 18px; padding: 18px 20px; }
  .ngonNgu { position: absolute; top: 12px; right: 12px; display: flex; padding: 2px; border-radius: 999px; background: rgba(255,255,255,.16); }
  .ngonNgu button { border: 0; padding: 3px 9px; border-radius: 999px; background: transparent; color: #fff; font: inherit; font-size: 11px; font-weight: 700; letter-spacing: .04em; cursor: pointer; opacity: .8; }
  .ngonNgu button.on { background: #fff; color: var(--dau); opacity: 1; }
  .hero .logo { display: block; width: auto; height: 56px; margin: -6px 0 4px -4px; }
  .hero h1 { margin: 2px 0; font-size: 22px; line-height: 1.25; font-weight: 700; }
  .hero p { margin: 0; font-size: 13px; opacity: .85; }
  .the, .phong { background: var(--the); border-radius: 16px; box-shadow: 0 1px 2px rgba(85,0,13,.06), 0 4px 14px rgba(85,0,13,.07); }
  .the { padding: 16px; margin-top: 12px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: var(--nhat); }
  .seg button { border: 0; padding: 9px 6px; border-radius: 9px; background: transparent; font: inherit; font-size: 14px; line-height: 1.3; font-weight: 600; color: var(--phu); cursor: pointer; }
  .seg button.on { background: var(--dau); color: #fff; box-shadow: 0 1px 3px rgba(85,0,13,.25); }
  .luoi { display: grid; gap: 10px; margin-top: 14px; }
  .luoi.hai { grid-template-columns: 1fr 1fr; }
  .luoi.ba { grid-template-columns: 1.4fr 1fr 1fr; }
  label { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--phu); }
  input, select { width: 100%; min-width: 0; padding: 10px; border: 1px solid var(--vien); border-radius: 10px; background: #fff; font: inherit; font-size: 15px; color: var(--chu); }
  input[type="date"] { -webkit-appearance: none; appearance: none; display: block; min-height: 44px; text-align: left; }
  input[type="date"]::-webkit-date-and-time-value { text-align: left; }
  input:focus, select:focus { outline: 2px solid var(--dau); outline-offset: 1px; }
  .goiY { margin: 8px 0 0; font-size: 12px; color: var(--phu); }
  .goiY span { display: block; }
  .goiY span + span { margin-top: 2px; }
  .goiY.noiBat { padding: 8px 10px; border-radius: 10px; background: var(--nhat); color: var(--dau); font-weight: 600; }
  .nut { display: block; width: 100%; margin-top: 14px; padding: 13px; border: 0; border-radius: 12px; background: var(--dau); color: #fff; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
  .nut:active { transform: translateY(1px); }
  .nut:disabled { opacity: .6; cursor: wait; }
  .loi { margin: 10px 0 0; font-size: 13px; color: var(--doChu); }
  .tom { margin: 18px 4px 4px; font-weight: 600; }
  .tom small { display: block; font-size: 12px; font-weight: 400; color: var(--phu); }
  .phong { margin-top: 12px; overflow: hidden; }
  .noiDung { padding: 14px; }
  .dauPhong { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tenPhong { font-weight: 600; }
  .moTa { margin: 4px 0 0; font-size: 12px; color: var(--phu); }
  .chip { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .chip.trong, .dem .trong { background: var(--xanh); color: var(--xanhChu); }
  .chip.motPhan { background: var(--vang); color: var(--vangChu); }
  .chip.kin, .dem .kin { background: var(--do); color: var(--doChu); }
  .dem { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .dem span { padding: 3px 8px; border-radius: 8px; font-size: 12px; }
  .dem .kin { text-decoration: line-through; }
  .gio { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; margin-top: 10px; }
  .gio i, .chuGiai b { display: block; height: 18px; border-radius: 3px; }
  .trong { background: var(--oTrong); } .dat { background: var(--oDat); } .qua { background: var(--oQua); }
  .gio i.chon, .chuGiai b.chon { box-shadow: inset 0 -4px 0 var(--dam); }
  .moc { display: flex; justify-content: space-between; margin-top: 2px; font-size: 10px; color: var(--phu); }
  .chuGiai { display: flex; flex-wrap: wrap; gap: 6px 12px; margin: 10px 4px 0; font-size: 11px; color: var(--phu); }
  .chuGiai span { display: flex; align-items: center; gap: 4px; }
  .chuGiai b { width: 12px; height: 12px; }
  .chuGiai b.chon { background: #fff; border: 1px solid var(--vien); }

  .anh { position: relative; aspect-ratio: 4 / 3; background: var(--nhat); }
  .truot { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .truot::-webkit-scrollbar { display: none; }
  .truot img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; object-position: center 40%; scroll-snap-align: start; cursor: zoom-in; }
  .anh .truot img:first-child { object-position: center 18%; }
  .phong.het .truot img { filter: grayscale(.7); opacity: .7; }
  .nhanHang { position: absolute; left: 10px; bottom: 10px; padding: 3px 9px; border-radius: 999px; background: rgba(85,0,13,.88); color: #fff; font-size: 11px; font-weight: 600; }
  .soAnh { position: absolute; right: 10px; bottom: 10px; padding: 2px 8px; border-radius: 999px; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; }
  .mui { position: absolute; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border: 0; border-radius: 50%; background: rgba(255,255,255,.9); color: var(--dam); font-size: 20px; line-height: 1; cursor: pointer; display: none; }
  .mui.trai { left: 8px; } .mui.phai { right: 8px; }
  @media (hover: hover) { .anh:hover .mui { display: block; } }

  .gia { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--vien); }
  .gia .nhan { font-size: 12px; color: var(--phu); }
  .gia .goc { font-size: 12px; color: var(--phu); text-decoration: line-through; }
  .gia .tong { font-size: 21px; font-weight: 700; line-height: 1.2; color: var(--dau); }
  .gia .giam { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 6px; background: var(--xanhChu); color: #fff; font-size: 11px; vertical-align: 3px; }
  .gia .lyDo { margin-top: 3px; font-size: 11px; font-weight: 600; color: var(--xanhChu); }
  .datPhong { flex: none; padding: 10px 14px; border-radius: 10px; background: var(--dau); color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; }
  .chiTiet { margin-top: 8px; font-size: 13px; }
  .chiTiet summary { cursor: pointer; color: var(--dau); font-weight: 600; }
  .dongGia { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; }
  .dongGia.tru span:last-child { color: var(--xanhChu); }
  .dongGia.gach span:last-child { color: var(--phu); text-decoration: line-through; }
  .dongGia.toiUu { color: var(--xanhChu); font-weight: 600; }
  .dongGia.tongCong { margin-top: 4px; padding-top: 6px; border-top: 1px solid var(--vien); font-weight: 700; }

  /* Flash sale: nổi bật hơn mọi ưu đãi khác (đỏ cam, có đếm ngược). */
  .fsBang { display: block; width: 100%; margin-top: 12px; padding: 14px 16px; border: 0; border-radius: 16px; text-align: left; cursor: pointer;
    color: #fff; font: inherit; background: linear-gradient(135deg, #E11D48, #F97316); box-shadow: 0 6px 18px rgba(225, 29, 72, .35); }
  .fsBang .fsDau { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; font-size: 20px; font-weight: 700; line-height: 1.2; }
  .fsBang .fsDau i { font-style: normal; display: inline-block; animation: nhay 1.2s ease-in-out infinite; }
  .fsBang .fsPhan { padding: 1px 8px; border-radius: 8px; background: #fff; color: #E11D48; font-size: 17px; }
  .fsBang .fsMoTa { margin-top: 6px; font-size: 13px; }
  .fsBang .fsGia { margin-top: 6px; font-size: 15px; font-weight: 600; }
  .fsBang .fsGia b { font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
  .fsBang .fsCuoi { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; }
  .fsBang .fsXem { padding: 5px 12px; border-radius: 999px; background: #fff; color: #E11D48; font-weight: 700; white-space: nowrap; }
  .demNguoc { font-weight: 700; font-variant-numeric: tabular-nums; }
  @keyframes nhay { 50% { transform: scale(1.25); } }
  @media (prefers-reduced-motion: reduce) { .fsBang .fsDau i { animation: none; } }
  .phong.fs { box-shadow: 0 0 0 2px #E11D48; }
  .fsNhan { position: absolute; top: 10px; left: 10px; z-index: 1; padding: 4px 10px; border-radius: 999px; color: #fff; font-size: 12px; font-weight: 700;
    background: linear-gradient(135deg, #E11D48, #F97316); box-shadow: 0 2px 8px rgba(0, 0, 0, .25); }
  .dauPhong .fsNhan { position: static; box-shadow: none; }
  .gia.fs .tong { color: #E11D48; }
  .gia .giam.fs { background: #E11D48; }
  .gia .lyDo.fs, .fsHan { color: #E11D48; }
  .fsHan { margin-top: 2px; font-size: 11px; font-weight: 600; }
  .dongGia.flash, .dongGia.flash span:last-child { color: #E11D48; font-weight: 700; }
  .ghiChu { margin: 14px 4px 0; font-size: 12px; color: var(--phu); }
  .themDem { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--vang); color: var(--vangChu); font-size: 13px; line-height: 1.4; }
  .themDem span { flex: 1; }
  .ghiDon { margin: 8px 0 0; font-size: 12px; line-height: 1.4; color: var(--phu); }
  .themDem.trongNgay { flex-wrap: wrap; }
  .themDem.trongNgay span { flex: 1 1 210px; }
  .themDem.trongNgay b { display: block; margin-top: 2px; font-size: 17px; }
  .themDem button { flex: none; padding: 8px 12px; border: 0; border-radius: 9px; background: var(--vangChu); color: #fff; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }

  /* Lịch trống của một phòng: nút trên ảnh phòng mở lịch 1 tháng, mỗi ngày một thanh giờ trống 0h → 24h. */
  .nutLich { position: absolute; top: 10px; right: 10px; z-index: 1; padding: 6px 11px; border: 0; border-radius: 999px; background: rgba(255,255,255,.95);
    color: var(--dau); font: inherit; font-size: 12px; font-weight: 700; line-height: 1.2; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.22); }
  .phong.vuaChon { animation: vuaChon 1.8s ease-out; }
  @keyframes vuaChon { 0%, 55% { box-shadow: 0 0 0 3px var(--dau); } }
  .lich { position: fixed; inset: 0; z-index: 55; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(43,26,28,.45); }
  .lichHop { width: 100%; max-width: 440px; max-height: 100%; overflow-y: auto; padding: 16px; border-radius: 18px; background: var(--the); box-shadow: 0 12px 40px rgba(0,0,0,.25); outline: none; }
  .lichDau { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .lichDau h2 { margin: 0; font-size: 17px; line-height: 1.3; }
  .lichDau p { margin: 2px 0 0; font-size: 12px; color: var(--phu); }
  .lichDong { flex: none; width: 36px; height: 36px; margin: -8px -8px 0 0; border: 0; border-radius: 50%; background: none; color: var(--chu); font-size: 28px; line-height: 1; cursor: pointer; }
  .lichThang { display: flex; align-items: center; justify-content: space-between; margin: 12px 0 6px; font-weight: 700; }
  .lichThang button { width: 34px; height: 34px; border: 1px solid var(--vien); border-radius: 50%; background: #fff; color: var(--chu); font: inherit; font-size: 18px; line-height: 1; cursor: pointer; }
  .lichThang button:disabled { opacity: .3; cursor: default; }
  .lichLuoi { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .thuL { padding: 2px 0 4px; text-align: center; font-size: 11px; font-weight: 600; color: var(--phu); }
  .ngayL { display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 50px; padding: 6px 1px 5px; border: 1px solid transparent; border-radius: 10px;
    background: none; color: var(--chu); font: inherit; text-align: center; }
  button.ngayL { cursor: pointer; }
  button.ngayL:hover { background: var(--nhat); }
  .ngayL b { font-size: 14px; line-height: 1.1; }
  .ngayL.kin b { color: #B9A9AB; font-weight: 400; text-decoration: line-through; }
  .ngayL.qua { min-height: 0; padding: 3px 1px; }
  .ngayL.qua b { color: #D3C8C9; font-weight: 400; }
  .ngayL.homNay b { color: var(--dau); }
  .ngayL.dangChon { border-color: var(--dau); }
  .thanhL { position: relative; display: block; width: 100%; max-width: 40px; height: 5px; border-radius: 3px; background: #ECE2E3; overflow: hidden; }
  .thanhL span, .lichChu i { position: absolute; top: 0; bottom: 0; background: #47A56C; }
  .ngayL small { font-size: 10px; line-height: 1.15; font-weight: 600; color: var(--xanhChu); }
  .lichChu { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 10px 2px 0; font-size: 11px; color: var(--phu); }
  .lichChu span { display: flex; align-items: center; gap: 5px; }
  .lichChu i { position: static; display: inline-block; width: 16px; height: 5px; border-radius: 3px; }
  .lichChu s { color: #B9A9AB; }
  @media (max-width: 480px) {
    .lich { align-items: flex-end; padding: 0; }
    .lichHop { max-width: none; max-height: 92%; border-radius: 18px 18px 0 0; padding: 14px 12px calc(16px + env(safe-area-inset-bottom)); }
  }

  .zalo { display: block; margin-top: 16px; padding: 12px; border: 2px solid var(--dau); border-radius: 14px; background: var(--the); color: var(--dau); text-align: center; font-weight: 700; text-decoration: none; }
  .zalo small { display: block; font-size: 12px; font-weight: 400; opacity: .85; }
  footer { margin: 14px 0 6px; text-align: center; font-size: 12px; color: var(--phu); }

  .hop { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: #120607; }
  .hopDau { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; color: #fff; font-size: 14px; }
  .hopDau button { border: 0; background: none; color: #fff; font-size: 30px; line-height: 1; cursor: pointer; }
  .hop .truot { flex: 1; min-height: 0; }
  .hop .truot img { object-fit: contain; object-position: center; cursor: default; }
  .toast { position: fixed; left: 50%; bottom: 18px; z-index: 60; max-width: 92%; transform: translateX(-50%); padding: 10px 14px; border-radius: 12px; background: var(--chu); color: #fff; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  [hidden] { display: none !important; }
  @media (max-width: 400px) {
    .luoi.hai { grid-template-columns: 1fr; }
    .luoi.ba { grid-template-columns: 1fr 1fr; }
    .luoi.ba label:first-child { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<div class="wrap">

/* Thiếu chữ ở ngôn ngữ đang chọn thì lấy bản tiếng Việt, vẫn thiếu thì để trống (không bao giờ hiện "undefined"). */
function c(k) {
  var v = CHU[NN][k], a = arguments;
  if (v === undefined) v = CHU.vi[k];
  if (v === undefined) return '';
  if (typeof v === 'function') return v.apply(null, [].slice.call(a, 1));
  return String(v).replace(/\{(\d)\}/g, function (_, i) { return a[+i + 1]; });
}

function phut(s) {

function iso(m) { return new Date(m * 60000).toISOString().slice(0, 10); }
function thu(m) { return new Date(m * 60000).getUTCDay(); }
function ngay(m) {

}
/* Giờ tròn: bản Việt 24 giờ (14:00), bản Anh 12 giờ (2:00PM). */
function gio(h) {

/* Tên phòng trong Sheet là tiếng Việt ("Phòng 101 - …"); bản tiếng Anh chỉ đổi chữ "Phòng". */

/* Cuối tuần: combo giờ là thứ 7, chủ nhật; qua đêm và 2 ngày 1 đêm là đêm thứ 6, thứ 7. Ngày lễ luôn tính cuối tuần. */

/* Sức chứa (chủ nhà, 23/11/2026): phòng lớn 101 và 202 ở được 6 khách, phòng nhỏ 201 và 301 được 4 khách; phòng không có ở đây
   theo "Số khách tối đa mỗi phòng" trong Sheet. */

function sucChua(ten) { var so = (String(ten).match(/\d+/) || [])[0]; return SUC_CHUA[so] || D.uuDai.toiDaKhach || 3; }
/* Phụ thu combo giờ ban ngày cho mỗi khách từ khách thứ 3 (Sheet chưa có dòng này thì dùng 50.000đ). */
function phuThuGio() { var v = D.uuDai.phuThuGio; return typeof v === 'number' ? v : 50000; }
/* "3" hoặc "3, 4" (bản Anh "3rd" hoặc "3rd & 4th"); từ 3 khách thêm thì "3–6" ("3rd–6th") cho dòng phụ thu. */

   nhận từ 07:00, trả sau 22:00 tới 24:00 vẫn tính giá combo giờ.
   Mọi combo giờ (ban ngày, combo tối) và gói Qua đêm nhận rạng sáng (00:00 → 08:00) phải chừa 1 tiếng dọn trước khi phòng kín lại
   (donTruocKhachSau); gói Qua đêm nhận tối và 2N1Đ không cộng. */

function laComboToi(ten, ngayM, tu, den) { return tu >= COMBO_TU && den > COMBO_DEN && den <= 24 && demDaBan(ten, ngayM); }

function kinLai(ten, moc) {
  var p = chuan(ten);
  return LICH.filter(function (b) { return b.phong === p && b.bd >= moc - 1 && b.kt > b.bd; })
    .reduce(function (s, b) { return Math.min(s, b.bd); }, Infinity);
}

function traMuonNhatSang(ten, ngayM, tu) {
  return Math.min(gioTraQuaDem(tu), Math.floor((kinLai(ten, ngayM + tu * 60) - GIO_DON - ngayM) / 60));
}
function phongTrongGio(ten, ngayM, tu, den) {
  return trangThai(ten, ngayM + tu * 60, ngayM + den * 60 + donTruocKhachSau(ten, ngayM, tu, den)) === 'trong';
}
/* Khung khách chọn vẫn trống, chỉ thiếu giờ dọn: nói rõ phòng kín lại lúc mấy giờ, trả muộn nhất mấy giờ. */

  var bd = ngayM + tu * 60, kt = ngayM + den * 60;

  var sau = kinLai(ten, kt);
  if (!isFinite(sau) || sau >= kt + GIO_DON) return null;

/* Gói 2 ngày 1 đêm: mỗi đêm theo giá ngày thường/cuối tuần, rồi trừ ưu đãi trong tab "Ưu đãi & lễ".
   Ở đủ số đêm thì cuối tuần tính giá ngày thường, riêng đêm lễ vẫn giữ giá lễ.

    if (fs && fs.gia >= giaGoc) fs = null;   // giá flash sale không rẻ hơn giá niêm yết thì bỏ

/* Combo giờ ban ngày: nhận từ 07:00, trả trước 22:00, chừa 1 tiếng dọn trước khi phòng kín lại. Dưới 3 giờ tính Combo 3 giờ; dài hơn thì trang so Combo 3 giờ,

   Last-minute chỉ ngày (đêm) thường theo đúng luật cuối tuần ở trên: qua đêm khi giờ nhận cách lúc xem trang không quá

/* GIO_DON = giờ dọn chừa thêm TRƯỚC khi phòng kín lại: 0, vì giờ kín trong Sheet đã gồm 1 tiếng chuẩn bị trước check-in của khách sau

/* ------------------------------ Flash sale ------------------------------

/* Một băng duy nhất tóm tắt mọi flash sale đang chạy; giá cụ thể từng phòng chỉ hiện ở kết quả sau khi khách kiểm tra.

/* Giá Last-minute rẻ nhất hôm nay của gói goi (0 Combo 3 giờ, 1 Combo 6 giờ, 2 Qua đêm, 2N1Đ) ở các phòng không có flash
   sale cho gói đó, theo đúng luật Last-minute của trang (chỉ ngày/đêm thường; combo nhận trong 4 tiếng tới và xong trước

function lmHomNay(goi) {

  D.phong.forEach(function (ten) {
    var g = D.gia[ten], niemYet = g && g.thuong[goi];

    var ok = false;

var THU_TU = { trong: 0, motPhan: 1, kin: 2 };

   thẻ: flash sale, Last-minute, Early-bird…) lên trước. Phòng chưa trống trọn khung: phòng gần giờ khách chọn nhất lên trước

  return [THU_TU[loai], 100 - pt, gan ? gan.lech : 0, gan ? -gan.tong : 0, viTri];
}
function soSanhThuTu(a, b) {

/* Độ gần của một phòng với khung khách chọn [bd, kt): số phút khách phải dời giờ để vừa một khoảng trống đủ dài, hoặc phải
   rút ngắn nếu chỉ trống được một phần khung (lấy cách lệch ít nhất); tong = số phút trống quanh đó (1 ngày trước, 2 ngày
   sau, không tính giờ đã qua). khe = khoảng trống đủ dài gần nhất khi cách tốt nhất là dời giờ. */
function doGan(ten, bd, kt) {

  LICH.filter(function (b) { return b.phong === p && b.kt > tu && b.bd < den; })
    .sort(function (a, b) { return a.bd - b.bd; })
    .forEach(function (b) { if (b.bd > con) trong.push([con, b.bd]); con = Math.max(con, b.kt); });
  if (con < den) trong.push([con, den]);
  var kq = { lech: 1e9, tong: 0, khe: null };
  trong.forEach(function (g) {
    kq.tong += g[1] - g[0];
    var lech, giao = Math.min(g[1], kt) - Math.max(g[0], bd);

  LICH.filter(function (b) { return b.phong === p && b.kt > con && b.bd < cuoi; })

   sau có khách sớm thì lùi giờ nhận (21h, 20h, 19h) để vẫn đủ 13 tiếng; tối còn kín tới 22h thì thử 23h.

function goiYTrongQuaDem(ten, ngayM, soKhach) {

     (đúng như thanh giờ: hết lượt kín liền trước, kể cả giờ dọn), để khách không hiểu lầm là phòng chỉ trống từ giờ nhận gói.
     Áp dụng mọi phòng, mọi ngày, kể cả giờ lẻ (lượt kín liền trước hết lúc 20h30 thì ghi "sau 20h30"). Chỉ ghi khi có lượt

    if (cheDo !== 'gio') { chonCheDo('gio'); goiYKhach(); }
    byId('ngayGio').value = iso(ngayM);
    doiKhungGio(ten, tu, den);
  });
  hop.appendChild(nut);
  return hop;
}

/* Phòng kín khung đã chọn nhưng chỉ lệch tối đa 3 tiếng: nút "Check-in 23h" (giờ tròn gần nhất còn trống, giữ nguyên số
   giờ khách chọn), bấm là xem giá giờ đó. Trả về null nếu không có giờ hợp lệ trên ô chọn giờ (giờ nhận 0–23 cùng ngày, giờ trả trong giới hạn). */
function goiYLechGio(ten, ngayM, tu, den, gan) {
  if (!gan.khe || gan.lech > 180) return null;
  var L = (den - tu) * 60, g = gan.khe, bd = ngayM + tu * 60, don = donTruocKhachSau(ten, ngayM, tu, den), han = g[1] - don, a, b;
  if (g[0] > bd) { a = Math.ceil((g[0] - ngayM) / 60) * 60 + ngayM; b = a + L; if (b > han) return null; }
  else {
    b = Math.floor((han - ngayM) / 60) * 60 + ngayM; a = b - L;
    if (a < g[0] || (don && tu >= COMBO_TU && a < ngayM + COMBO_TU * 60)) return null;   // không lùi combo ngày thành giá qua đêm
  }
  var tu2 = (a - ngayM) / 60, den2 = (b - ngayM) / 60;
  if (tu2 < 0 || tu2 > 23 || den2 > denToiDa(tu2) || a + 60 <= BAY_GIO || !phongTrongGio(ten, ngayM, tu2, den2)) return null;
  var gioNhan = NN === 'en' ? (tu2 % 12 || 12) + (tu2 < 12 ? 'AM' : 'PM') : tu2 + 'h';
  var hop = el('div', 'themDem'), nut = el('button', null, c('nutLechGio', gioNhan));
  hop.appendChild(el('span', null, c('lechGio', c('tieng', Math.abs(tu2 - tu)))));
  nut.title = gio(tu2) + ' → ' + moc(den2);
  nut.type = 'button';
  nut.addEventListener('click', function () { doiKhungGio(ten, tu2, den2); });
  hop.appendChild(nut);
  return hop;
}

/* Phòng không đủ chỗ cho số khách đã chọn: hiện mờ ở cuối danh sách, không báo giá. */
function khongVua(ten, viTri) {
  return { o: thePhong(ten, 'kin', c('toiDaKhach', sucChua(ten)), true), thuTu: [9, 0, 0, 0, viTri] };
}

/* ------------------------- Lịch trống của một phòng -------------------------
   Nút "📅 Lịch trống" trên ảnh phòng mở lịch 1 tháng của riêng phòng đó: mỗi ngày một thanh 0h → 24h (phần xanh là giờ còn
   trống) và giờ trống ghi như lịch nội bộ (trước 13h, từ 17h, từ 11h đến 19h); ngày kín gạch ngang. Không phân biệt khách đặt hay chủ nhà tự khoá.
   Khoảng trống ngắn hơn 3 tiếng (không đủ gói nhỏ nhất) và giờ đã qua không tính là trống.
   Bấm vào ngày còn trống: trang chuyển sang ngày đó và hiện giá của phòng (chonNgayLich). */
var LICH_PHONG = null, LICH_THANG = 0, LICH_NUT = null;   // phòng đang mở lịch, tháng đang xem (phút đầu mùng 1), nút đã bấm
function dauThang(m, n) { var d = new Date(m * 60000); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + (n || 0), 1) / 60000; }
function tenThang(m) {
  var d = new Date(m * 60000);
  return NN === 'en' ? CHU.en.thangDu[d.getUTCMonth()] + ' ' + d.getUTCFullYear() : 'Tháng ' + (d.getUTCMonth() + 1) + '/' + d.getUTCFullYear();
}
/* Giờ sớm nhất còn đặt được: giờ tròn kế tiếp (như ô "Từ" mặc định của hôm nay). */
function gioDatSomNhat() { return Math.floor((BAY_GIO - HOM_NAY) / 60) + 1; }
/* Các khoảng trống của phòng trong [tu, den) (phút), dài từ 3 tiếng, không tính giờ đã qua. */
function khoangTrongPhong(ten, tu, den) {
  var p = chuan(ten), con = Math.max(tu, HOM_NAY + gioDatSomNhat() * 60), ra = [];
  LICH.filter(function (b) { return b.phong === p && b.kt > con && b.bd < den; })
    .sort(function (a, b) { return a.bd - b.bd; })
    .forEach(function (b) { if (b.bd > con) ra.push([con, b.bd]); con = Math.max(con, b.kt); });
  if (con < den) ra.push([con, den]);
  return ra.filter(function (k) { return k[1] - k[0] >= 180; });
}
/* Phần trống trong ngày m (phút tính từ 0:00 của ngày đó), bỏ mẩu dưới 1 tiếng. */
function trongTrongNgay(ds, m) {
  var ra = [];
  ds.forEach(function (k) { var a = Math.max(k[0], m), b = Math.min(k[1], m + 1440); if (b - a >= 60) ra.push([a - m, b - m]); });
  return ra;
}
/* Giờ gọn trên ô ngày: bản Việt 17h, 17h30; bản Anh 5pm, 5:30pm. */
function gioGon(p) {
  var h = Math.floor(p / 60) % 24, ph = p % 60;
  if (NN === 'en') return (h % 12 || 12) + (ph ? ':' + pad(ph) : '') + (h < 12 ? 'am' : 'pm');
  return h + 'h' + (ph ? pad(ph) : '');
}
/* Cách ghi như lịch nội bộ: "trước 13h", "từ 17h", "từ 11h đến 19h". */
function nhanKhoang(k) {
  if (k[0] <= 0) return c('lichTruoc', gioGon(k[1]));
  if (k[1] >= 1440) return c('lichTu', gioGon(k[0]));
  return c('lichTuDen', gioGon(k[0]), gioGon(k[1]));
}

function moLich(ten, nut) {
  var chon = byId(cheDo === 'dem' ? 'ngayNhan' : 'ngayGio').value, dau = dauThang(HOM_NAY);
  LICH_PHONG = ten;
  LICH_NUT = nut || null;
  LICH_THANG = Math.min(Math.max(chon ? dauThang(phut(chon)) : dau, dau), dauThang(dau, 11));
  veLich();
  byId('lich').hidden = false;
  document.body.style.overflow = 'hidden';
  byId('lichHop').focus();
}

function dongLich(giuCho) {
  byId('lich').hidden = true;
  document.body.style.overflow = '';
  if (!giuCho && LICH_NUT && document.body.contains(LICH_NUT)) LICH_NUT.focus();
  LICH_PHONG = LICH_NUT = null;
}

function veLich() {
  var ten = LICH_PHONG, luoi = byId('lichLuoi'), dau = LICH_THANG, sau = dauThang(dau, 1), homNay = dauThang(HOM_NAY);
  var ds = khoangTrongPhong(ten, dau, sau + 2 * 1440), chon = byId(cheDo === 'dem' ? 'ngayNhan' : 'ngayGio').value;
  byId('lichTen').textContent = c('lichTieuDe', tenNgan(ten));
  byId('lichGoiY').textContent = c('lichGoiY');
  byId('lichThang').textContent = tenThang(dau);
  byId('lichTruoc').disabled = dau <= homNay;
  byId('lichSau').disabled = dau >= dauThang(homNay, 11);
  luoi.textContent = '';
  [1, 2, 3, 4, 5, 6, 0].forEach(function (i) { luoi.appendChild(el('span', 'thuL', CHU[NN].thu[i])); });
  for (var i = (thu(dau) + 6) % 7; i > 0; i--) luoi.appendChild(el('span'));
  for (var m = dau; m < sau; m += 1440) {
    var k = m < HOM_NAY ? [] : trongTrongNgay(ds, m), co = k.length > 0;
    var o = el(co ? 'button' : 'span', 'ngayL' + (m < HOM_NAY ? ' qua' : co ? '' : ' kin') + (m === HOM_NAY ? ' homNay' : '')
      + (iso(m) === chon ? ' dangChon' : ''));
    o.appendChild(el('b', null, new Date(m * 60000).getUTCDate()));
    if (co) {
      var thanh = el('i', 'thanhL'), caNgay = k.length === 1 && k[0][0] <= 0 && k[0][1] >= 1440;
      k.forEach(function (x) {
        var s = el('span');
        s.style.left = x[0] / 14.4 + '%';
        s.style.width = (x[1] - x[0]) / 14.4 + '%';
        thanh.appendChild(s);
      });
      o.appendChild(thanh);
      if (!caNgay) k.slice(0, 2).forEach(function (x) { o.appendChild(el('small', null, nhanKhoang(x))); });
      o.type = 'button';
      o.setAttribute('aria-label', ngay(m) + ': ' + (caNgay ? c('lichCaNgay') : c('lichTrongKhoang', k.map(nhanKhoang).join(', '))));
      o.addEventListener('click', chonNgayLich.bind(null, ten, m));
    } else if (m >= HOM_NAY) o.setAttribute('aria-label', ngay(m) + ': ' + c('lichKin'));
    luoi.appendChild(o);
  }
  var chu = byId('lichChu'), a = el('span'), b = el('span');
  chu.textContent = '';
  a.appendChild(el('i'));
  a.appendChild(document.createTextNode(c('lichCgTrong')));
  b.appendChild(el('s', null, '15'));
  b.appendChild(document.createTextNode(c('lichCgKin')));
  chu.appendChild(a);
  chu.appendChild(b);
}

/* Khung giờ tượng trưng khi khách bấm một ngày (tab combo giờ): giữ khung đang chọn nếu ngày đó còn trống; không thì
   combo 3 giờ sớm nhất còn trống trong giờ combo, rồi gói Qua đêm từ 22:00, rồi giờ trống đầu tiên của ngày (tối đa 3 giờ).
   Khách tự chỉnh lại giờ sau khi thấy giá. */
function khungTuongTrung(ten, m) {
  var som = m === HOM_NAY ? gioDatSomNhat() : 0, tu = +byId('tuGio').value, den = +byId('denGio').value, h;
  function trong(a, b) { return phongTrongGio(ten, m, a, b); }
  if (tu >= som && den > tu && den <= denToiDa(tu) && trong(tu, den)) return [tu, den];
  if (tu >= som && tu < COMBO_TU) {   // đang xem gói rạng sáng: giữ giờ nhận, rút giờ trả cho kịp dọn
    var tra = Math.min(den, traMuonNhatSang(ten, m, tu));
    if (tra - tu >= 3 && trong(tu, tra)) return [tu, tra];
  }
  for (h = Math.max(COMBO_TU, som); h + 3 <= COMBO_DEN; h++) if (trong(h, h + 3)) return [h, h + 3];
  if (som <= QUA_DEM_TU && trong(QUA_DEM_TU, gioTraQuaDem(QUA_DEM_TU))) return [QUA_DEM_TU, gioTraQuaDem(QUA_DEM_TU)];
  var thuTu = [];   // giờ trống đầu tiên: ưu tiên trong giờ combo, rồi mới tới tối muộn / rạng sáng
  for (h = Math.max(COMBO_TU, som); h < COMBO_DEN; h++) thuTu.push(h);
  for (h = som; h < 24; h++) if (h < COMBO_TU || h >= COMBO_DEN) thuTu.push(h);
  for (var i = 0; i < thuTu.length; i++) {
    h = thuTu[i];
    if (!trong(h, h + 1)) continue;
    var d = h + 1, max = Math.min(h + 3, denToiDa(h));
    while (d < max && trong(h, d + 1)) d++;
    return [h, d];
  }
  return [Math.max(som, Math.min(tu, 23)), Math.max(som, Math.min(tu, 23)) + 3];
}

/* Bấm một ngày trên lịch: tab 2 ngày 1 đêm mà đêm đó còn trống thì nhận phòng ngày đó (giữ số đêm khách đang chọn,
   bớt dần nếu các đêm sau đã kín); còn lại chuyển sang tab combo giờ với khung giờ tượng trưng. Rồi kiểm tra và cuộn tới
   thẻ của phòng đó. */
function chonNgayLich(ten, m) {
  dongLich(true);
  KHACH_SUA = true;
  var nhan = m + D.gioNhan * 60;
  if (cheDo === 'dem' && trangThai(ten, nhan, m + 1440 + D.gioTra * 60) === 'trong') {
    var a = byId('ngayNhan').value, b = byId('ngayTra').value, soDem = a && b ? Math.round((phut(b) - phut(a)) / 1440) : 1;
    soDem = Math.min(30, Math.max(1, soDem || 1));
    while (soDem > 1 && trangThai(ten, nhan, m + soDem * 1440 + D.gioTra * 60) !== 'trong') soDem--;
    byId('ngayNhan').value = iso(m);
    byId('ngayTra').min = iso(m + 1440);
    byId('ngayTra').value = iso(m + soDem * 1440);
  } else {
    if (cheDo !== 'gio') { chonCheDo('gio'); goiYKhach(); }
    var k = khungTuongTrung(ten, m);
    byId('ngayGio').value = iso(m);
    byId('tuGio').value = String(k[0]);
    dsGioDen(false);
    byId('denGio').value = String(k[1]);
    giaiThichGio();
  }
  kiemTra();
  var the = Array.from(byId('ketQua').querySelectorAll('.phong')).filter(function (o) { return o.dataset.phong === ten; })[0];
  (the || byId('ketQua')).scrollIntoView({ behavior: 'smooth', block: 'start' });
  if (the) {
    the.classList.add('vuaChon');
    setTimeout(function () { the.classList.remove('vuaChon'); }, 1800);
  }
}

/* Ở thiếu đúng 1 đêm để được ưu đãi "từ N đêm chỉ tính giá ngày thường" và có đêm cuối tuần được hạ giá:
   gợi ý đặt thêm đêm kế tiếp (nếu phòng còn trống), ghi tổng mới và phần chỉ phải trả thêm. */
function goiYThemDem(ten, nhan, tra, soDem, soKhach, gia) {
  var u = D.uuDai, moi = soDem + 1, kt = tra + D.gioTra * 60;
  if (moi !== u.tuDemGiaThuong || moi > 30) return null;
  var coHa = false;
  for (var i = 0; i < moi; i++) { var m = nhan + i * 1440; if (cuoiTuanDem(m) && !laLe(m)) coHa = true; }
  if (!coHa || trangThai(ten, kt, kt + 1440) !== 'trong') return null;
  var g = giaDem(ten, nhan, moi, soKhach);
  if (!g) return null;
  var hop = el('div', 'themDem'), nut = el('button', null, c('nutThemDem'));
  hop.appendChild(el('span', null, c('themDem', gio(D.gioTra) + ' ' + ngay(tra + 1440), moi, tien(g.tong), tien(g.tong - gia.tong))));
  nut.type = 'button';
  nut.addEventListener('click', function () {
    byId('ngayTra').value = iso(tra + 1440);
    kiemTra();
    byId('ketQua').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  hop.appendChild(nut);
  return hop;
}

function hienKetQua(ds, soTrong, moTa) {
  var kq = byId('ketQua'), n = D.phong.length;
  kq.textContent = '';
  var tom = el('p', 'tom', soTrong === n ? c('caPhong', n) : soTrong === 0 ? c('khongTrong') : c('soTrong', soTrong, n));
  tom.appendChild(el('small', null, moTa));
  kq.appendChild(tom);
  ds.sort(soSanhThuTu).forEach(function (x) { kq.appendChild(x.o); });
}

function ghiChuGia() {
  byId('ketQua').appendChild(el('p', 'ghiChu', c('ghiChuGia', D.ten)));
}

function kiemTraDem() {
  if (!byId('ngayNhan').value || !byId('ngayTra').value) return c('loiChonNgayDem');
  var nhan = phut(byId('ngayNhan').value), tra = phut(byId('ngayTra').value);
  var soDem = Math.round((tra - nhan) / 1440), soKhach = +byId('soKhach').value || 2;
  if (nhan < HOM_NAY) return c('loiNhanQua');
  if (soDem < 1) return c('loiTraSau');
  if (soDem > 30) return c('loi30');
  var bd = nhan + D.gioNhan * 60, kt = tra + D.gioTra * 60, soTrong = 0;
  var tomTat = c('tomTatDem', gio(D.gioNhan), ngay(nhan), gio(D.gioTra), ngay(tra), c('dem', soDem), c('khach', soKhach));
  var ds = D.phong.map(function (ten, viTri) {
    if (soKhach > sucChua(ten)) return khongVua(ten, viTri);
    var tong = trangThai(ten, bd, kt), dem = [], demTrong = 0;
    for (var i = 0; i < soDem; i++) {
      var s = bd + i * 1440, t = trangThai(ten, s, i === soDem - 1 ? kt : s + 1440);
      if (t === 'trong') demTrong++;
      dem.push([s, t]);
    }
    var loai = tong === 'trong' ? 'trong' : demTrong ? 'motPhan' : 'kin';
    if (loai === 'trong') soTrong++;
    var o = thePhong(ten, loai, { trong: c('conTrong'), motPhan: c('trongDem', demTrong, soDem), kin: c('hetPhong') }[loai]);
    if (tong !== 'trong' && soDem > 1) {
      var hang = el('div', 'dem');
      dem.forEach(function (d) { hang.appendChild(el('span', d[1] === 'trong' ? 'trong' : 'kin', ngay(d[0]))); });
      o.noiDung.appendChild(hang);
    }
    var gia = loai === 'trong' ? giaDem(ten, nhan, soDem, soKhach) : null;
    if (gia) o.noiDung.appendChild(khoiGia(ten, gia, tomTat));
    if (gia && gia.fs.length) danhDauFlash(o);
    var them = gia ? goiYThemDem(ten, nhan, tra, soDem, soKhach, gia) : loai === 'kin' && soDem === 1 ? goiYTrongQuaDem(ten, nhan, soKhach) : null;
    if (them) o.noiDung.appendChild(them);
    return { o: o, thuTu: thuTuPhong(loai, viTri, gia, loai === 'trong' ? null : doGan(ten, bd, kt)) };
  });
  hienKetQua(ds, soTrong, c('tomDem', gio(D.gioNhan), ngay(nhan), gio(D.gioTra), ngay(tra), c('dem', soDem), c('khach', soKhach)));
  ghiChuGia();
}

function kiemTraGio() {
  if (!byId('ngayGio').value) return c('loiChonNgay');
  var ngayM = phut(byId('ngayGio').value), tu = +byId('tuGio').value, den = +byId('denGio').value;
  var quaDem = laQuaDem(tu, den), ra = quaDem ? Math.max(den, gioTraQuaDem(tu)) : den;
  /* Phòng trống xét đúng giờ khách chọn; gói Qua đêm thì thanh giờ hiện tới trưa hôm sau để khách tự xem. */
  var bd = ngayM + tu * 60, kt = ngayM + den * 60, soTrong = 0, soO = ra > 24 ? 36 : 24, soKhach = +byId('soKhach').value || 2;
  if (den <= tu) return c('loiGioTra');
  if (kt <= BAY_GIO) return c('loiKhungQua');
  if (bd + 60 <= BAY_GIO) return c('loiGioNhanQua', gio(Math.floor((BAY_GIO - HOM_NAY) / 60)));
  function mocNgay(h) { return h >= 24 ? gio(h - 24) + ' ' + ngay(ngayM + 1440) : gio(h); }
  var coComboToi = false, coTraSom = false;
  giaiThichGio();
  var ds = D.phong.map(function (ten, viTri) {
    if (soKhach > sucChua(ten)) return khongVua(ten, viTri);
    var loai = phongTrongGio(ten, ngayM, tu, den) ? 'trong' : 'kin';
    if (loai === 'trong') {
      soTrong++;
      if (laComboToi(ten, ngayM, tu, den)) coComboToi = true;
      if (tu < COMBO_TU && traMuonNhatSang(ten, ngayM, tu) < ra) coTraSom = true;
    }
    var o = thePhong(ten, loai, { trong: c('conTrong'), kin: c('daKin') }[loai]);
    var thanh = el('div', 'gio'), moc = el('div', 'moc');
    thanh.style.gridTemplateColumns = 'repeat(' + soO + ', 1fr)';
    if (soO > 24) thanh.style.gap = '1px';
    for (var h = 0; h < soO; h++) {
      var s = ngayM + h * 60;
      var o2 = el('i', (s + 60 <= BAY_GIO ? 'qua' : trangThai(ten, s, s + 60)) + (h >= tu && h < den ? ' chon' : ''));
      o2.title = gio(h % 24) + (h >= 24 ? ' ' + c('homSau') : '');
      thanh.appendChild(o2);
    }
    (soO > 24 ? [0, 6, 12, 18, 24, 30, 36] : [0, 6, 12, 18, 24]).forEach(function (h) {
      moc.appendChild(el('span', null, NN === 'en' ? (h % 12 || 12) + (h % 24 < 12 ? 'AM' : 'PM') : (soO > 24 ? h % 24 : h) + 'h'));
    });
    o.noiDung.appendChild(thanh);
    o.noiDung.appendChild(moc);
    var gia = loai === 'kin' ? null : giaGio(ten, ngayM, tu, den, soKhach), gan = null;
    if (gia) {
      var goi = gia.kieu === 'quaDem' ? c('quaDemTomTat', gia.tra - tu) : gia.kieu === '2n1d' ? c('tomTat2N1D') : '';
      o.noiDung.appendChild(khoiGia(ten, gia, c('tomTatGio', ngay(ngayM), gio(tu), mocNgay(gia.tra), goi, c('khach', soKhach))));
      if (gia.fs.length) danhDauFlash(o);
    }
    if (loai === 'kin') {
      gan = doGan(ten, bd, kt + donTruocKhachSau(ten, ngayM, tu, den));
      var ghi = ghiChuDon(ten, ngayM, tu, den);
      if (ghi) o.noiDung.appendChild(ghi);
      var goiY = goiYTraSom(ten, ngayM, tu, den, soKhach) || goiYLechGio(ten, ngayM, tu, den, gan) || goiYTrongNgay(ten, ngayM, tu, den, soKhach)
        || (!quaDem && goiYTrongQuaDem(ten, ngayM, soKhach));
      if (goiY) o.noiDung.appendChild(goiY);
    }
    return { o: o, thuTu: thuTuPhong(loai, viTri, gia, gan) };
  });
  var ghiQuaDem = quaDem && !coComboToi && !coTraSom;
  hienKetQua(ds, soTrong, (ghiQuaDem ? c('quaDemTieng', ra - tu) : '') + ngay(ngayM) + ' · ' + gio(tu) + ' → ' + mocNgay(ghiQuaDem ? ra : den) + ' · ' + c('khach', soKhach));
  var cg = el('div', 'chuGiai');
  [['trong', c('cgTrong')], ['dat', c('cgDat')], ['qua', c('cgQua')], ['chon', c('cgChon')]].forEach(function (x) {
    var s = el('span');
    s.appendChild(el('b', x[0]));
    s.appendChild(document.createTextNode(x[1]));
    cg.appendChild(s);
  });
  byId('ketQua').appendChild(cg);
  ghiChuGia();
}

function kiemTra() {
  if (!D) return;   // dữ liệu chưa về: khoiTao tự kiểm tra khi về, theo đúng ngày giờ khách đã chọn
  var loi = cheDo === 'dem' ? kiemTraDem() : kiemTraGio();
  byId('loi').hidden = !loi;
  if (loi) {
    byId('loi').textContent = loi;
    byId('ketQua').textContent = '';
  }
}

/* Nạp dữ liệu từ Sheet vào các biến dùng chung. Gọi khi khởi tạo và khi bản mới về thay cho bản lưu đệm. */
var CHUOI_DL = '';
function khongGio(d) { return JSON.stringify(d, function (k, v) { return k === 'bayGio' ? undefined : v; }); }
function napDuLieu(duLieu) {
  CHUOI_DL = khongGio(duLieu);
  D = duLieu;
  D.gia = D.gia || {};
  D.anh = D.anh || {};
  D.uuDai = D.uuDai || { lastMinute: 0, earlyBird: 0, earlyBirdNgay: 30, tuDemGiaThuong: 99, dai5: 0, dai7: 0, dai15: 0, phuThu: 0, toiDaKhach: 3, ngayLe: [] };
  LE = {};
  (D.uuDai.ngayLe || []).forEach(function (s) { LE[s] = 1; });
  BAY_GIO = phut(D.bayGio);
  HOM_NAY = Math.floor(BAY_GIO / 1440) * 1440;
  LICH = D.lich.map(function (b) { return { phong: chuan(b.phong), bd: phut(b.bd), kt: phut(b.kt) }; });
}

/* Bản mới từ Sheet về sau khi trang đã hiện từ bản lưu đệm: lịch hoặc giá có đổi thì tính lại kết quả, không thì chỉ cập nhật giờ. */
function capNhatDuLieu(moi) {
  var doi = khongGio(moi) !== CHUOI_DL;
  napDuLieu(moi);
  apDungNgonNgu();
  if (doi) kiemTra();
  if (doi && LICH_PHONG) veLich();
}

/* Form gắn ngay khi mở trang theo đồng hồ máy khách (giờ Việt Nam = UTC+7), không chờ dữ liệu từ Sheet,
   để khách chọn ngày giờ trong lúc dữ liệu đang tải. Dữ liệu về thì không đặt lại những gì khách đã chọn. */
var KHACH_SUA = false, NGAY_FORM = null;
function bayGioMay() { return phut(new Date(Date.now() + 7 * 3600000).toISOString().slice(0, 16)); }

/* Ngày giờ mặc định: hôm nay; combo giờ lấy giờ tròn kế tiếp, trước 07:00 sáng thì 07:00, sau 23:00 thì 07:00 hôm sau. */
function ganMacDinh(bayGio) {
  var homNay = Math.floor(bayGio / 1440) * 1440, ngayMai = homNay + 1440;
  ['ngayNhan', 'ngayGio'].forEach(function (id) { byId(id).min = iso(homNay); byId(id).value = iso(homNay); });
  byId('ngayTra').min = iso(ngayMai);
  byId('ngayTra').value = iso(ngayMai);
  var tiep = Math.floor((bayGio - homNay) / 60) + 1;
  if (tiep > 23) { byId('ngayGio').value = iso(ngayMai); tiep = COMBO_TU; }
  else if (tiep < COMBO_TU) tiep = COMBO_TU;
  byId('tuGio').value = tiep;
  dsGioDen(false);
  NGAY_FORM = homNay;
}

/* Ô số khách 1…n, giữ số đã chọn (mặc định 2). */
function dsSoKhach(n) {
  var s = byId('soKhach'), cu = +s.value || 2;
  if (s.options.length === n) return;
  s.textContent = '';
  for (var k = 1; k <= n; k++) s.add(new Option(c('khach', k), k));
  s.value = Math.min(cu, n);
}

function ganForm() {
  BAY_GIO = bayGioMay();
  HOM_NAY = Math.floor(BAY_GIO / 1440) * 1440;
  for (var h = 0; h < 24; h++) byId('tuGio').add(new Option(gio(h), h));
  ganMacDinh(BAY_GIO);
  dsSoKhach(Math.max.apply(null, [3].concat(Object.keys(SUC_CHUA).map(function (k) { return SUC_CHUA[k]; }))));
  ['ngayNhan', 'ngayTra', 'ngayGio', 'tuGio', 'denGio', 'soKhach'].forEach(function (id) {
    byId(id).addEventListener('change', function (e) { if (e.isTrusted) KHACH_SUA = true; });
  });
  byId('tuGio').addEventListener('change', function () { dsGioDen(true); giaiThichGio(); });
  byId('denGio').addEventListener('change', giaiThichGio);
  byId('ngayGio').addEventListener('change', giaiThichGio);

  byId('ngayNhan').addEventListener('change', function () {
    if (!this.value) return;
    var n = phut(this.value);
    byId('ngayTra').min = iso(n + 1440);
    if (!byId('ngayTra').value || phut(byId('ngayTra').value) <= n) byId('ngayTra').value = iso(n + 1440);
  });
  document.querySelectorAll('.seg button').forEach(function (b) {
    b.addEventListener('click', function () {
      chonCheDo(b.getAttribute('data-che-do'));
      goiYKhach();
      kiemTra();
    });
  });
  byId('kiemTra').addEventListener('click', kiemTra);
  byId('soKhach').addEventListener('change', kiemTra);
  byId('dongHop').addEventListener('click', dongHop);
  byId('dongLich').addEventListener('click', function () { dongLich(); });
  byId('lich').addEventListener('click', function (e) { if (e.target === this) dongLich(); });
  [['lichTruoc', -1], ['lichSau', 1]].forEach(function (x) {
    byId(x[0]).addEventListener('click', function () { LICH_THANG = dauThang(LICH_THANG, x[1]); veLich(); });
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !byId('lich').hidden) dongLich(); });
  document.addEventListener('keydown', function (e) {
    if (byId('hop').hidden) return;
    var truot = byId('hopTruot');
    if (e.key === 'Escape') dongHop();
    if (e.key === 'ArrowRight') truot.scrollBy({ left: truot.clientWidth, behavior: 'smooth' });
    if (e.key === 'ArrowLeft') truot.scrollBy({ left: -truot.clientWidth, behavior: 'smooth' });
  });
  dienTuLink();
  apDungNgonNgu();
}

function khoiTao(duLieu) {
  napDuLieu(duLieu);
  /* Ngày theo Sheet khác ngày theo máy khách (máy lệch giờ) mà khách chưa tự chọn gì thì đặt lại mặc định theo Sheet. */
  if (!KHACH_SUA && HOM_NAY !== NGAY_FORM) { ganMacDinh(BAY_GIO); dienTuLink(); }
  else if (D.gioTra !== GIO_TRA_TAM) dsGioDen(true);
  ['ngayNhan', 'ngayGio'].forEach(function (id) { byId(id).min = iso(HOM_NAY); });
  byId('ngayTra').min = iso(Math.max(HOM_NAY, byId('ngayNhan').value ? phut(byId('ngayNhan').value) : 0) + 1440);
  dsSoKhach(Math.max.apply(null, D.phong.map(sucChua)));
  apDungNgonNgu();
  kiemTra();
}

/* Đổi tab giống khi khách bấm nút tab: 'gio' = combo giờ và qua đêm, 'dem' = 2 ngày 1 đêm. */
function chonCheDo(m) {
  cheDo = m;
  document.querySelectorAll('.seg button').forEach(function (x) {
    var on = x.getAttribute('data-che-do') === m;
    x.classList.toggle('on', on);
    x.setAttribute('aria-selected', on);
  });
  byId('formDem').hidden = cheDo !== 'dem';
  byId('formGio').hidden = cheDo !== 'gio';
}

/* Điền sẵn form từ link (thanh đặt phòng trên website gửi qua iframe), chạy một lần sau khi tải dữ liệu:
   ?mode=dem&in=2026-11-20&out=2026-11-22&guests=2
   ?mode=gio&date=2026-11-20&from=14&to=17&guests=2   (to từ 24 trở lên là hôm sau, vd 36 = 12:00 trưa hôm sau)
   Thiếu mode thì đoán theo tham số có mặt. Giá trị sai, thiếu hoặc đã qua thì bỏ qua, giữ mặc định của hôm nay. */
function dienTuLink() {
  try {
    var q = new URLSearchParams(location.search);
    function ngayLink(k) {
      var s = q.get(k);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return null;
      var m = phut(s);
      return iso(m) === s && m >= HOM_NAY ? m : null;
    }
    function soLink(k, nho, lon) {
      var s = q.get(k);
      if (!/^\d{1,3}$/.test(s || '')) return null;
      var n = +s;
      return n >= nho && n <= lon ? n : null;
    }
    var m = q.get('mode');
    if (m !== 'dem' && m !== 'gio') m = q.has('in') || q.has('out') ? 'dem' : q.has('date') || q.has('from') ? 'gio' : null;
    if (m) chonCheDo(m);

    if (m === 'dem') {
      var nhan = ngayLink('in'), tra = ngayLink('out');
      if (nhan === null) nhan = phut(byId('ngayNhan').value);
      byId('ngayNhan').value = iso(nhan);
      byId('ngayTra').min = iso(nhan + 1440);
      byId('ngayTra').value = iso(tra !== null && tra > nhan ? tra : nhan + 1440);
    }

    if (m === 'gio') {
      var ngayM = ngayLink('date'), tu = soLink('from', 0, 23);
      if (ngayM === null) ngayM = phut(byId('ngayGio').value);
      if (tu === null) tu = +byId('tuGio').value;
      /* Giờ nhận đã qua (vd hôm nay mà giờ đã trôi) thì giữ ngày giờ mặc định, bỏ luôn giờ trả trên link. */
      var dung = ngayM + tu * 60 + 60 > BAY_GIO;
      if (dung) {
        byId('ngayGio').value = iso(ngayM);
        byId('tuGio').value = tu;
      }
      dsGioDen(false);
      var den = dung ? soLink('to', 1, 48) : null;
      if (den !== null && Array.from(byId('denGio').options).some(function (o) { return +o.value === den; })) byId('denGio').value = den;
      giaiThichGio();
    }

    var khach = q.get('guests'), s = byId('soKhach');
    if (/^\d{1,3}$/.test(khach || '') && s.options.length) {
      s.value = Math.max(+s.options[0].value, Math.min(+khach, +s.options[s.options.length - 1].value));
    }
  } catch (e) {}
}

/* Ô "Đến" chỉ có giờ sau giờ nhận, tới giờ trả muộn nhất (denToiDa). Đổi giờ nhận combo thì giữ giờ trả nếu còn hợp lệ;
   giờ nhận của gói Qua đêm (hoặc combo không còn đủ 3 giờ trước 22:00) thì đặt giờ trả theo gói Qua đêm. */
function dsGioDen(giu) {
  var tu = +byId('tuGio').value, s = byId('denGio'), cu = +s.value, max = denToiDa(tu);
  var quaDem = laQuaDem(tu, tu + 1), macDinh = quaDem || tu + 3 > COMBO_DEN ? gioTraQuaDem(tu) : tu + 3;
  s.textContent = '';
  for (var k = tu + 1; k <= max; k++) s.add(new Option(moc(k), k));
  s.value = giu && !quaDem && cu > tu && cu <= max ? cu : macDinh;
}

/* Dòng nhắc dưới ô chọn giờ, chỉ hiện khi khách nhận giờ combo mà chọn trả lố qua 22:00 nhưng chưa tới giờ trả
   của gói Qua đêm (vd 19:00 → 23:00): báo là đã thành gói Qua đêm và được ở tới mấy giờ. */
function giaiThichGio() {
  var tu = +byId('tuGio').value, den = +byId('denGio').value, p = byId('giaiThich'), ra = gioTraQuaDem(tu);
  p.hidden = !(tu >= COMBO_TU && tu < QUA_DEM_TU && den > COMBO_DEN && den < ra);
  if (p.hidden) return;
  var chon = byId('ngayGio').value, m = chon ? phut(chon) : null;
  var coToi = !!(D && LICH && m !== null && D.phong.some(function (ten) { return laComboToi(ten, m, tu, den); }));
  p.textContent = coToi ? c('giaiComboToi', gio(COMBO_DEN), moc(ra)) : c('giaiSau21', gio(COMBO_DEN), gio(tu), moc(ra), ra - tu);
}

/* Dòng phụ thu dưới ô số khách: tab combo ghi cả mức combo giờ và qua đêm, tab 2 ngày 1 đêm ghi theo đêm. */
function goiYKhach() {
  if (!D) return;
  var u = D.uuDai, p = byId('goiYKhach'), dong = [];
  if (cheDo === 'gio' && u.phuThu) dong = [c('phuThuDau'), c('phuThuDongGio', tien(phuThuGio())), c('phuThuDongDem', tien(u.phuThu))];
  else if (u.phuThu) dong = [c('phuThuTu3', tien(u.phuThu))];
  if (!dong.length) dong.push(c('treEm'));
  p.textContent = '';
  dong.forEach(function (s) { p.appendChild(el('span', null, s)); });
}

/* Đổi chữ theo ngôn ngữ đang chọn. Phần cần dữ liệu (giờ nhận/trả, phụ thu, liên hệ) chỉ điền khi đã tải xong. */
function apDungNgonNgu() {
  document.documentElement.lang = NN;
  document.title = c('tieuDeTrang');
  document.querySelectorAll('[data-c]').forEach(function (e) { e.textContent = c(e.getAttribute('data-c')); });
  document.querySelectorAll('.ngonNgu button').forEach(function (b) {
    var on = b.getAttribute('data-nn') === NN;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on);
  });
  byId('hop').setAttribute('aria-label', c('anhPhong'));
  byId('dongHop').setAttribute('aria-label', c('dong'));
  byId('dongLich').setAttribute('aria-label', c('dong'));
  byId('lichTruoc').setAttribute('aria-label', c('thangTruoc'));
  byId('lichSau').setAttribute('aria-label', c('thangSau'));
  if (LICH_PHONG) veLich();
  var gy = byId('goiYGio');
  gy.textContent = '';
  gy.appendChild(el('span', null, c('goiYCombo', gio(COMBO_TU), gio(COMBO_DEN))));
  gy.appendChild(el('span', null, c('goiYQuaDem', gio(QUA_DEM_TU), gio(COMBO_TU - 1), gio(QUA_DEM_MUON))));
  Array.from(byId('tuGio').options).forEach(function (o) { o.text = gio(+o.value); });
  if (D) veFlash();
  /* Nửa đêm ghi "00:00 hôm sau" (bản Anh 12:00AM next day) cho khỏi nhầm với 0 giờ hôm nay. */
  Array.from(byId('denGio').options).forEach(function (o) { o.text = moc(+o.value); });
  giaiThichGio();
  Array.from(byId('soKhach').options).forEach(function (o) { o.text = c('khach', +o.value); });
  if (!D) return;
  byId('goiYDem').textContent = c('goiYDem', gio(D.gioNhan), gio(D.gioTra));
  var cn = D.bayGio.split('T'), t = cn[1].split(':'), d = cn[0].split('-');
  byId('capNhat').textContent = NN === 'en'
    ? (+t[0] % 12 || 12) + ':' + t[1] + (+t[0] < 12 ? 'AM' : 'PM') + ' ' + (+d[2]) + ' ' + CHU.en.thang[d[1] - 1] + ' ' + d[0]
    : cn[1] + ' ' + d.slice().reverse().join('/');
  goiYKhach();
  byId('zalo').href = linkLienHe();
  byId('soZalo').textContent = lienHe();
}

/* Ngôn ngữ: ?lang=en|vi trên link, rồi tới lựa chọn lần trước của khách, mặc định tiếng Việt. */
NN = (function () {
  var q = (location.search.match(/[?&]lang=(vi|en)\b/) || [])[1];
  if (q) return q;
  try { return localStorage.getItem('ngonNgu') === 'en' ? 'en' : 'vi'; } catch (e) { return 'vi'; }
})();
document.querySelectorAll('.ngonNgu button').forEach(function (b) {
  b.addEventListener('click', function () {
    NN = b.getAttribute('data-nn');
    try { localStorage.setItem('ngonNgu', NN); } catch (e) {}
    apDungNgonNgu();
    if (D) kiemTra();
  });
});
apDungNgonNgu();

/* Sheet trả dữ liệu mất vài giây, nên trình duyệt lưu đệm bản gần nhất 10 phút: trang hiện kết quả ngay từ bản lưu
   rồi tự cập nhật khi bản mới về. ?warm=1: chỉ tải sẵn dữ liệu vào bản lưu (website gọi ngầm khi khách bắt đầu chọn ngày). */
var KHO = 'monacaLich', HAN_KHO = 600000, CHI_TAI_SAN = /[?&]warm=1\b/.test(location.search);
/* Giờ trong bản lưu là lúc tải về: cộng thêm thời gian đã trôi để "bây giờ" (Last-minute, giờ đã qua) không bị lùi. */
function docKho() {
  try {
    var x = JSON.parse(localStorage.getItem(KHO) || 'null'), troi = x ? Date.now() - x.t : HAN_KHO;
    if (!(troi < HAN_KHO)) return null;
    x.d.bayGio = new Date((phut(x.d.bayGio) + Math.floor(Math.max(0, troi) / 60000)) * 60000).toISOString().slice(0, 16);
    return x.d;
  } catch (e) { return null; }
}
function ghiKho(d) { try { localStorage.setItem(KHO, JSON.stringify({ t: Date.now(), d: d })); } catch (e) {} }

if (!CHI_TAI_SAN) { try { ganForm(); } catch (e) {} }
var banLuu = CHI_TAI_SAN ? null : docKho();
if (banLuu) {
  try { khoiTao(banLuu); } catch (e) { D = null; banLuu = null; byId('ketQua').textContent = ''; }
}
if (!banLuu && !CHI_TAI_SAN) byId('ketQua').appendChild(el('p', 'tom', c('dangTai')));
(TAI_LICH || Promise.reject(new Error('fetch')))
  .then(function (d) {
    ghiKho(JSON.parse(JSON.stringify(d)));
    if (CHI_TAI_SAN) return;
    if (D) capNhatDuLieu(d);
    else { byId('ketQua').textContent = ''; khoiTao(d); }
  })
  .catch(function () {
    if (CHI_TAI_SAN || D) return;
    byId('ketQua').textContent = '';
    byId('loi').hidden = false;
    byId('loi').textContent = c('loiTai');
  });
</script>
</body>
</html>
