<title>Monaca Homestay · Tra cứu phòng trống</title>
<meta name="description" content="Chọn ngày ở, xem ngay phòng nào của Monaca Homestay còn trống và giá cho đúng ngày bạn chọn.">

<meta property="og:description" content="Chọn ngày ở, xem ngay phòng nào còn trống và giá cho đúng ngày bạn chọn.">

<style>
  :root {
    --dam: #55000D; --dau: #790013; --dauNhat: #9B1B2A; --nen: #FBF5F3; --nhat: #F6ECEB; --the: #FFFFFF;
    --chu: #2B1A1C; --phu: #7D6A6C; --vien: #ECDCDC;
    --xanh: #E2F2E6; --xanhChu: #1E6B3A; --vang: #FCEFD2; --vangChu: #85570A; --do: #F6E0E2; --doChu: #790013;
    --oTrong: #BFE3CB; --oDat: #790013; --oQua: #EEE6E6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--nen); color: var(--chu); font: 15px/1.5 'Lexend', system-ui, -apple-system, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  .hero { position: relative; background: linear-gradient(135deg, var(--dam), var(--dau) 60%, var(--dauNhat)); color: #fff; border-radius: 18px; padding: 18px 20px; }
  .ngonNgu { position: absolute; top: 12px; right: 12px; display: flex; padding: 2px; border-radius: 999px; background: rgba(255,255,255,.16); }
  .ngonNgu button { border: 0; padding: 3px 9px; border-radius: 999px; background: transparent; color: #fff; font: inherit; font-size: 11px; font-weight: 700; letter-spacing: .04em; cursor: pointer; opacity: .8; }
  .ngonNgu button.on { background: #fff; color: var(--dau); opacity: 1; }
  .hero .logo { display: block; width: auto; height: 56px; margin: -6px 0 4px -4px; }
  .hero h1 { margin: 2px 0; font-size: 22px; line-height: 1.25; font-weight: 700; }
  .hero p { margin: 0; font-size: 13px; opacity: .85; }
  .the, .phong { background: var(--the); border-radius: 16px; box-shadow: 0 1px 2px rgba(85,0,13,.06), 0 4px 14px rgba(85,0,13,.07); }
  .the { padding: 16px; margin-top: 12px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: var(--nhat); }
  .seg button { border: 0; padding: 9px 6px; border-radius: 9px; background: transparent; font: inherit; font-size: 14px; line-height: 1.3; font-weight: 600; color: var(--phu); cursor: pointer; }
  .seg button.on { background: var(--dau); color: #fff; box-shadow: 0 1px 3px rgba(85,0,13,.25); }
  .luoi { display: grid; gap: 10px; margin-top: 14px; }
  .luoi.hai { grid-template-columns: 1fr 1fr; }
  .luoi.ba { grid-template-columns: 1.4fr 1fr 1fr; }
  label { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--phu); }
  input, select { width: 100%; min-width: 0; padding: 10px; border: 1px solid var(--vien); border-radius: 10px; background: #fff; font: inherit; font-size: 15px; color: var(--chu); }
  input[type="date"] { -webkit-appearance: none; appearance: none; display: block; min-height: 44px; text-align: left; }
  input[type="date"]::-webkit-date-and-time-value { text-align: left; }
  input:focus, select:focus { outline: 2px solid var(--dau); outline-offset: 1px; }
  .goiY { margin: 8px 0 0; font-size: 12px; color: var(--phu); }
  .nut { display: block; width: 100%; margin-top: 14px; padding: 13px; border: 0; border-radius: 12px; background: var(--dau); color: #fff; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
  .nut:active { transform: translateY(1px); }
  .nut:disabled { opacity: .6; cursor: wait; }
  .loi { margin: 10px 0 0; font-size: 13px; color: var(--doChu); }
  .tom { margin: 18px 4px 4px; font-weight: 600; }
  .tom small { display: block; font-size: 12px; font-weight: 400; color: var(--phu); }
  .phong { margin-top: 12px; overflow: hidden; }
  .noiDung { padding: 14px; }
  .dauPhong { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tenPhong { font-weight: 600; }
  .moTa { margin: 4px 0 0; font-size: 12px; color: var(--phu); }
  .chip { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .chip.trong, .dem .trong { background: var(--xanh); color: var(--xanhChu); }
  .chip.motPhan { background: var(--vang); color: var(--vangChu); }
  .chip.kin, .dem .kin { background: var(--do); color: var(--doChu); }
  .dem { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .dem span { padding: 3px 8px; border-radius: 8px; font-size: 12px; }
  .dem .kin { text-decoration: line-through; }
  .gio { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; margin-top: 10px; }
  .gio i, .chuGiai b { display: block; height: 18px; border-radius: 3px; }
  .trong { background: var(--oTrong); } .dat { background: var(--oDat); } .qua { background: var(--oQua); }
  .gio i.chon, .chuGiai b.chon { box-shadow: inset 0 -4px 0 var(--dam); }
  .moc { display: flex; justify-content: space-between; margin-top: 2px; font-size: 10px; color: var(--phu); }
  .chuGiai { display: flex; flex-wrap: wrap; gap: 6px 12px; margin: 10px 4px 0; font-size: 11px; color: var(--phu); }
  .chuGiai span { display: flex; align-items: center; gap: 4px; }
  .chuGiai b { width: 12px; height: 12px; }
  .chuGiai b.chon { background: #fff; border: 1px solid var(--vien); }

  .anh { position: relative; aspect-ratio: 4 / 3; background: var(--nhat); }
  .truot { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .truot::-webkit-scrollbar { display: none; }
  .truot img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; object-position: center 40%; scroll-snap-align: start; cursor: zoom-in; }
  .anh .truot img:first-child { object-position: center 18%; }
  .phong.het .truot img { filter: grayscale(.7); opacity: .7; }
  .nhanHang { position: absolute; left: 10px; bottom: 10px; padding: 3px 9px; border-radius: 999px; background: rgba(85,0,13,.88); color: #fff; font-size: 11px; font-weight: 600; }
  .soAnh { position: absolute; right: 10px; bottom: 10px; padding: 2px 8px; border-radius: 999px; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; }
  .mui { position: absolute; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border: 0; border-radius: 50%; background: rgba(255,255,255,.9); color: var(--dam); font-size: 20px; line-height: 1; cursor: pointer; display: none; }
  .mui.trai { left: 8px; } .mui.phai { right: 8px; }
  @media (hover: hover) { .anh:hover .mui { display: block; } }

  .gia { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--vien); }
  .gia .nhan { font-size: 12px; color: var(--phu); }
  .gia .goc { font-size: 12px; color: var(--phu); text-decoration: line-through; }
  .gia .tong { font-size: 21px; font-weight: 700; line-height: 1.2; color: var(--dau); }
  .gia .giam { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 6px; background: var(--xanhChu); color: #fff; font-size: 11px; vertical-align: 3px; }
  .gia .lyDo { margin-top: 3px; font-size: 11px; font-weight: 600; color: var(--xanhChu); }
  .datPhong { flex: none; padding: 10px 14px; border-radius: 10px; background: var(--dau); color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; }
  .chiTiet { margin-top: 8px; font-size: 13px; }
  .chiTiet summary { cursor: pointer; color: var(--dau); font-weight: 600; }
  .dongGia { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; }
  .dongGia.tru span:last-child { color: var(--xanhChu); }
  .dongGia.tongCong { margin-top: 4px; padding-top: 6px; border-top: 1px solid var(--vien); font-weight: 700; }
  .ghiChu { margin: 14px 4px 0; font-size: 12px; color: var(--phu); }

  .zalo { display: block; margin-top: 16px; padding: 12px; border: 2px solid var(--dau); border-radius: 14px; background: var(--the); color: var(--dau); text-align: center; font-weight: 700; text-decoration: none; }
  .zalo small { display: block; font-size: 12px; font-weight: 400; opacity: .85; }
  footer { margin: 14px 0 6px; text-align: center; font-size: 12px; color: var(--phu); }
  footer a { color: var(--dau); }

  .hop { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: #120607; }
  .hopDau { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; color: #fff; font-size: 14px; }
  .hopDau button { border: 0; background: none; color: #fff; font-size: 30px; line-height: 1; cursor: pointer; }
  .hop .truot { flex: 1; min-height: 0; }
  .hop .truot img { object-fit: contain; object-position: center; cursor: default; }
  .toast { position: fixed; left: 50%; bottom: 18px; z-index: 60; max-width: 92%; transform: translateX(-50%); padding: 10px 14px; border-radius: 12px; background: var(--chu); color: #fff; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  [hidden] { display: none !important; }
  @media (max-width: 400px) {
    .luoi.hai { grid-template-columns: 1fr; }
    .luoi.ba { grid-template-columns: 1fr 1fr; }
    .luoi.ba label:first-child { grid-column: 1 / -1; }
  }
</style>
</head>

   Ở đủ số đêm thì cuối tuần tính giá ngày thường, riêng đêm lễ vẫn giữ giá lễ.

/* Combo theo giờ: dưới 3 giờ tính Combo 3 giờ; dài hơn thì cộng giờ thêm cho tới khi đắt hơn gói lớn hơn

    return { o: o, thuTu: THU_TU[loai] * 100 + viTri };
  });
  hienKetQua(ds, soTrong, c('tomDem', gio(D.gioNhan), ngay(nhan), gio(D.gioTra), ngay(tra), c('dem', soDem), c('khach', soKhach)));
  ghiChuGia();
}

function kiemTraGio() {
  if (!byId('ngayGio').value) return c('loiChonNgay');
  var ngayM = phut(byId('ngayGio').value), tu = +byId('tuGio').value, den = +byId('denGio').value, ra = gioRa(tu, den);
  /* Phòng trống xét đúng giờ khách chọn; gói Qua đêm thì thanh giờ hiện tới trưa hôm sau để khách tự xem. */
  var bd = ngayM + tu * 60, kt = ngayM + den * 60, soTrong = 0, soO = ra > 24 ? 36 : 24, soKhach = +byId('soKhach').value || 2;
  if (den <= tu) return c('loiGioTra');
  if (kt <= BAY_GIO) return c('loiKhungQua');
  if (bd + 60 <= BAY_GIO) return c('loiGioNhanQua', gio(Math.floor((BAY_GIO - HOM_NAY) / 60)));
  var denChu = ra > 24 ? gio(ra - 24) + ' ' + ngay(ngayM + 1440) : gio(ra);
  var tomTat = c('tomTatGio', ngay(ngayM), gio(tu), denChu, tu >= 21 ? c('quaDemTomTat', ra - tu) : '', c('khach', soKhach));
  var ds = D.phong.map(function (ten, viTri) {
    var tong = trangThai(ten, bd, kt);
    var loai = tong === 'trong' ? 'trong' : 'kin';
    if (loai === 'trong') soTrong++;
    var o = thePhong(ten, loai, { trong: c('conTrong'), kin: c('daKin') }[loai]);
    var thanh = el('div', 'gio'), moc = el('div', 'moc');
    thanh.style.gridTemplateColumns = 'repeat(' + soO + ', 1fr)';
    if (soO > 24) thanh.style.gap = '1px';
    for (var h = 0; h < soO; h++) {
      var s = ngayM + h * 60;
      var o2 = el('i', (s + 60 <= BAY_GIO ? 'qua' : trangThai(ten, s, s + 60)) + (h >= tu && h < den ? ' chon' : ''));
      o2.title = gio(h % 24) + (h >= 24 ? ' ' + c('homSau') : '');
      thanh.appendChild(o2);
    }
    (soO > 24 ? [0, 6, 12, 18, 24, 30, 36] : [0, 6, 12, 18, 24]).forEach(function (h) {
      moc.appendChild(el('span', null, NN === 'en' ? (h % 12 || 12) + (h % 24 < 12 ? 'AM' : 'PM') : (soO > 24 ? h % 24 : h) + 'h'));
    });
    o.noiDung.appendChild(thanh);
    o.noiDung.appendChild(moc);
    var gia = loai === 'kin' ? null : giaGio(ten, ngayM, tu, den, soKhach);
    if (gia) o.noiDung.appendChild(khoiGia(ten, gia, tomTat));
    return { o: o, thuTu: THU_TU[loai] * 100 + viTri };
  });
  hienKetQua(ds, soTrong, (tu >= 21 ? c('quaDemTieng', ra - tu) : '') + ngay(ngayM) + ' · ' + gio(tu) + ' → ' + denChu + ' · ' + c('khach', soKhach));
  var cg = el('div', 'chuGiai');
  [['trong', c('cgTrong')], ['dat', c('cgDat')], ['qua', c('cgQua')], ['chon', c('cgChon')]].forEach(function (x) {
    var s = el('span');
    s.appendChild(el('b', x[0]));
    s.appendChild(document.createTextNode(x[1]));
    cg.appendChild(s);
  });
  byId('ketQua').appendChild(cg);
  ghiChuGia();
}

function kiemTra() {
  var loi = cheDo === 'dem' ? kiemTraDem() : kiemTraGio();
  byId('loi').hidden = !loi;
  if (loi) {
    byId('loi').textContent = loi;
    byId('ketQua').textContent = '';
  }
}

function khoiTao(duLieu) {
  D = duLieu;
  D.gia = D.gia || {};
  D.anh = D.anh || {};
  D.uuDai = D.uuDai || { lastMinute: 0, earlyBird: 0, earlyBirdNgay: 30, tuDemGiaThuong: 99, dai5: 0, dai7: 0, dai15: 0, phuThu: 0, toiDaKhach: 3, ngayLe: [] };
  (D.uuDai.ngayLe || []).forEach(function (s) { LE[s] = 1; });
  BAY_GIO = phut(D.bayGio);
  HOM_NAY = Math.floor(BAY_GIO / 1440) * 1440;
  LICH = D.lich.map(function (b) { return { phong: chuan(b.phong), bd: phut(b.bd), kt: phut(b.kt) }; });
  var homNay = iso(HOM_NAY), ngayMai = iso(HOM_NAY + 1440);
  ['ngayNhan', 'ngayGio'].forEach(function (id) { byId(id).min = homNay; byId(id).value = homNay; });
  byId('ngayTra').min = ngayMai;
  byId('ngayTra').value = ngayMai;
  for (var h = 0; h < 24; h++) byId('tuGio').add(new Option(gio(h), h));
  for (var k = 1; k <= 36; k++) byId('denGio').add(new Option('', k));
  var tiep = Math.floor((BAY_GIO - HOM_NAY) / 60) + 1;
  if (tiep > 21) { byId('ngayGio').value = ngayMai; tiep = 9; }
  byId('tuGio').value = tiep;
  byId('denGio').value = Math.min(24, tiep + 3);
  for (var n = 1; n <= (D.uuDai.toiDaKhach || 3); n++) byId('soKhach').add(new Option('', n));
  byId('soKhach').value = Math.min(2, D.uuDai.toiDaKhach || 3);

  byId('ngayNhan').addEventListener('change', function () {
    if (!this.value) return;
    var n = phut(this.value);
    byId('ngayTra').min = iso(n + 1440);
    if (!byId('ngayTra').value || phut(byId('ngayTra').value) <= n) byId('ngayTra').value = iso(n + 1440);
  });
  document.querySelectorAll('.seg button').forEach(function (b) {
    b.addEventListener('click', function () {
      cheDo = b.getAttribute('data-che-do');
      document.querySelectorAll('.seg button').forEach(function (x) {
        x.classList.toggle('on', x === b);
        x.setAttribute('aria-selected', x === b);
      });
      byId('formDem').hidden = cheDo !== 'dem';
      byId('formGio').hidden = cheDo !== 'gio';
      kiemTra();
    });
  });
  byId('kiemTra').addEventListener('click', kiemTra);
  byId('soKhach').addEventListener('change', kiemTra);
  byId('dongHop').addEventListener('click', dongHop);
  document.addEventListener('keydown', function (e) {
    if (byId('hop').hidden) return;
    var truot = byId('hopTruot');
    if (e.key === 'Escape') dongHop();
    if (e.key === 'ArrowRight') truot.scrollBy({ left: truot.clientWidth, behavior: 'smooth' });
    if (e.key === 'ArrowLeft') truot.scrollBy({ left: -truot.clientWidth, behavior: 'smooth' });
  });

  byId('xemLich').href = D.xemLich;
  byId('kiemTra').disabled = false;
  apDungNgonNgu();
  kiemTra();
}

/* Đổi chữ theo ngôn ngữ đang chọn. Phần cần dữ liệu (giờ nhận/trả, phụ thu, liên hệ) chỉ điền khi đã tải xong. */
function apDungNgonNgu() {
  document.documentElement.lang = NN;
  document.title = c('tieuDeTrang');
  document.querySelectorAll('[data-c]').forEach(function (e) { e.textContent = c(e.getAttribute('data-c')); });
  document.querySelectorAll('.ngonNgu button').forEach(function (b) {
    var on = b.getAttribute('data-nn') === NN;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on);
  });
  byId('hop').setAttribute('aria-label', c('anhPhong'));
  byId('dongHop').setAttribute('aria-label', c('dong'));
  if (!D) return;
  byId('goiYDem').textContent = c('goiYDem', gio(D.gioNhan), gio(D.gioTra));
  Array.from(byId('tuGio').options).forEach(function (o) { o.text = gio(+o.value); });
  /* 24:00 là nửa đêm; bản Anh ghi 12:00AM next day cho khỏi nhầm với 0 giờ hôm nay. */
  Array.from(byId('denGio').options).forEach(function (o) {
    var k = +o.value;
    o.text = k > 24 || (k === 24 && NN === 'en') ? gio(k - 24) + ' ' + c('homSau') : gio(k);
  });
  var cn = D.bayGio.split('T'), t = cn[1].split(':'), d = cn[0].split('-');
  byId('capNhat').textContent = NN === 'en'
    ? (+t[0] % 12 || 12) + ':' + t[1] + (+t[0] < 12 ? 'AM' : 'PM') + ' ' + (+d[2]) + ' ' + CHU.en.thang[d[1] - 1] + ' ' + d[0]
    : cn[1] + ' ' + d.slice().reverse().join('/');
  Array.from(byId('soKhach').options).forEach(function (o) { o.text = c('khach', +o.value); });
  byId('goiYKhach').textContent = (D.uuDai.phuThu ? c('phuThuTu3', tien(D.uuDai.phuThu)) : '') + c('treEm');
  byId('zalo').href = linkLienHe();
  byId('soZalo').textContent = lienHe();
}

/* Ngôn ngữ: ?lang=en|vi trên link, rồi tới lựa chọn lần trước của khách, mặc định tiếng Việt. */
NN = (function () {
  var q = (location.search.match(/[?&]lang=(vi|en)\b/) || [])[1];
  if (q) return q;
  try { return localStorage.getItem('ngonNgu') === 'en' ? 'en' : 'vi'; } catch (e) { return 'vi'; }
})();
document.querySelectorAll('.ngonNgu button').forEach(function (b) {
  b.addEventListener('click', function () {
    NN = b.getAttribute('data-nn');
    try { localStorage.setItem('ngonNgu', NN); } catch (e) {}
    apDungNgonNgu();
    if (D) kiemTra();
  });
});
apDungNgonNgu();

byId('kiemTra').disabled = true;
byId('ketQua').appendChild(el('p', 'tom', c('dangTai')));
fetch(API, { cache: 'no-store' })
  .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(function (d) { byId('ketQua').textContent = ''; khoiTao(d); })
  .catch(function () {
    byId('ketQua').textContent = '';
    byId('loi').hidden = false;
    byId('loi').textContent = c('loiTai');
  });
</script>
</body>
</html>
